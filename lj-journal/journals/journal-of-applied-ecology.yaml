    value: [anonymized manuscript ≤7000 words (Standard Paper), numbered structured Summary ≤350 words ending in 'Synthesis and applications', separate title page with author info, data-availability statement, data+code archived (Dryad/Zenodo) with private-for-peer-review link, inclusion/stakeholder statement, CRediT contributions, conflict-of-interest declaration, funding statement, ORCID for all authors, cover letter naming the applied-ecology contribution, 3–5 suggested reviewers, AI-disclosure block if applicable]
    confidence: secondary
