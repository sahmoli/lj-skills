scope:
  value: >
    High-impact research at the interface of ecological science and the management of biological resources —
    conservation biology, global change, environmental pollution, wildlife/pest management, restoration ecology.
    Papers must test or apply ecological concepts with explicit, concrete potential to improve environmental
    management or policy; not basic ecology without an applied payoff, and not purely local description.
  confidence: secondary
  source_url: https://besjournals.onlinelibrary.wiley.com/journal/13652664
  last_verified: 2026-06-22
# what THIS journal rewards + audience. AUTHORITATIVE sources only (official/editorial/society); null = no reliable source found, left blank by design.
taste:
  value: 'Journal of Applied Ecology rewards novel, broad-reaching research at the interface of ecological
    science and environmental management that builds a high-quality evidence base for real-world decisions;
    submissions must point to concrete management or policy applications rather than theory alone. It
    explicitly serves a tri-partite audience of scientists, managers and policymakers, so papers must
    be useful and accessible beyond the authors'' subfield. This applied bar is enforced in the writing:
    a mandatory final subheading (''Synthesis and applications'' for management recommendations, or
    ''Policy implications'' for broader policy links) and a final synthesis that is ''generic, seminal
    and accessible to non-specialists''.'
  confidence: secondary
  source_url: https://besjournals.onlinelibrary.wiley.com/hub/journal/13652664/aims-and-scope/read-full-aims-and-scope
  last_verified: '2026-06-22'
  audience:
    value: Explicitly serves a tri-partite audience of scientists, managers and policymakers; papers
      are expected to be useful and accessible beyond specialists in the authors' subfield.
    confidence: secondary
    source_url: https://besjournals.onlinelibrary.wiley.com/hub/journal/13652664/aims-and-scope/read-full-aims-and-scope
  writing_style:
    value: Structured abstract following a fixed formula (context/need; approach; main results; wider
      management/policy implications) as simple factual numbered statements, max ~350 words. The final
      synthesis point is the most important and must be generic, seminal and accessible to non-specialists,
      signalling a clear premium on clarity and applied framing.
    confidence: secondary
    source_url: https://besjournals.onlinelibrary.wiley.com/hub/journal/13652664/about/author-guidelines
  figure_preference:
    value: null
    confidence: unknown
    source_url: null
  signals:
    value: 'Mandatory final-section subheading: ''Synthesis and applications'' for papers giving management
      recommendations, or ''Policy implications'' for less hands-on policy/conservation links. Structured
      numbered abstract. Welcomes non-standard types: reviews, Practitioner''s Perspectives, Policy
      Directions, Forum articles. Double-anonymous peer review since Aug 2023; Editor''s Choice feature.'
    confidence: secondary
    source_url: https://besjournals.onlinelibrary.wiley.com/hub/journal/13652664/about/author-guidelines

