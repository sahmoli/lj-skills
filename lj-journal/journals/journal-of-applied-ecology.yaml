desk_reject_triggers:
  - "Standard Paper over 7000 words (figure legends COUNT) → trim to cap before submitting; push detail to SI."
  - "Strong basic ecology but no concrete management/policy implication → reframe the applied 'so what' and write a real 'Synthesis and applications' final Summary point."
  - "Manuscript not anonymized (double-anonymous since Aug 2023) → strip author identity from MS; upload title page separately."
  - "No data-availability statement / data+code not archived (Dryad/Zenodo) at submission → deposit now and supply a private-for-peer-review link."
  - "Missing inclusion / stakeholder-collaboration statement (JAE requires it at submission) → add it."
  - "Sensitive species localities exposed → mask/coarsen precise coordinates and state that you did."

reporting:
  data_availability_statement:
    required: true
    confidence: secondary
    source_url: https://besjournals.onlinelibrary.wiley.com/hub/data_archiving_policy
    last_verified: 2026-06-22
  data_repository:
    value: "Public archive mandatory as a condition of publication — Dryad (common) or domain-specific/Zenodo; must allow full reproduction of every result. Private-for-peer-review upload supported."
    confidence: secondary
    source_url: https://besjournals.onlinelibrary.wiley.com/hub/data_archiving_policy
    last_verified: 2026-06-22
  code_sharing:
    value: "New scripts for non-standard analyses must be archived alongside the data in a suitable repository (Dryad/Zenodo); provide anonymized at submission."
    confidence: secondary
    source_url: https://besjournals.onlinelibrary.wiley.com/hub/data_archiving_policy
    last_verified: 2026-06-22
  reporting_guideline:
    value: "No single mandated checklist; BES encourages best-practice reporting (e.g. PRISMA-EcoEvo for systematic reviews/meta-analyses, STRANGE for behavioural studies). VERIFY current wording."
    confidence: unknown
    source_url: https://besjournals.onlinelibrary.wiley.com/hub/editorial-policies
    last_verified: 2026-06-22
  sensitive_locality:
    value: "Mask/coarsen precise locations of threatened or trafficked taxa; state masking (BES editorial policy)."
    confidence: secondary
    source_url: https://besjournals.onlinelibrary.wiley.com/hub/editorial-policies
    last_verified: 2026-06-22
  orcid:
    value: "ORCID iD required for all authors at submission. CRediT contributor roles also required."
    confidence: secondary
    source_url: https://besjournals.onlinelibrary.wiley.com/hub/journal/13652664/about/author-guidelines
    last_verified: 2026-06-22
  inclusion_statement:
    value: "JAE-specific: statement on inclusion required at submission (collaboration with, intellectual input from, and outcome-sharing with stakeholders in the study region); optional in published Author Contributions."
    confidence: secondary
    source_url: https://besjournals.onlinelibrary.wiley.com/hub/editorial-policies
    last_verified: 2026-06-22

ai_disclosure:
  placement: inherit                   # → wiley_bes inherits wiley: Methods OR Acknowledgements (no single mandated section)
  block:
    value: >
      "During the preparation of this work the author(s) used [TOOL/SERVICE incl. version + access date]
      in order to [REASON, e.g. improve language and readability]. After using this tool/service, the
      author(s) reviewed and edited the content as needed and take(s) full responsibility for the content
      of the publication." (Wiley/COPE: generative AI cannot be listed as an author; grammar/spell/general
      editing tools are exempt from disclosure.)
    confidence: official
    source_url: https://authorservices.wiley.com/ethics-guidelines/index.html
    last_verified: 2026-06-22

submission:
