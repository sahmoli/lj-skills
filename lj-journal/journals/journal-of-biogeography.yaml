scope:
  value: >
    Publishes original biogeographic research and synthesis on the spatial and temporal patterns of
    biodiversity and the processes that generate them — the distribution of life across geography and
    through time. Welcomes work spanning ecological, evolutionary, palaeo-, conservation and methodological
    biogeography across marine, terrestrial and freshwater systems and all taxa, that addresses a clear
    biogeographic question with conclusions of general relevance — not local description for its own sake.
  confidence: secondary
  source_url: https://onlinelibrary.wiley.com/journal/13652699
  last_verified: 2026-06-22
# what THIS journal rewards + audience. AUTHORITATIVE sources only (official/editorial/society); null = no reliable source found, left blank by design.
taste:
  value: Journal of Biogeography rewards work at the intersection of biology and geography that not
    only describes biodiversity patterns but reveals the mechanisms shaping them through time (from
    the deep past into the future) and from local to global scales, welcoming ecological, evolutionary,
    genomic and theoretical approaches to understudied, vexing and urgent questions. Its core readership
    is biogeographers, ecologists, evolutionary and conservation biologists, botanists and zoologists,
    and the flat team of equal Senior Editors (no single EIC) is actively working to widen reach toward
    other stakeholders such as policymakers. Distinctively, it brands review articles "Synthesis" rather
    than "Review" to demand integrated, contradiction-resolving, framework-building scholarship, and
    requires a structured abstract (Aim, Location, Taxon, Methods, Results, Main conclusions; <=300
    words) with Research Articles held to roughly 6,000 words and conventional IMRaD structure.
  confidence: secondary
  source_url: https://www.wiley.com/en-us/journals/Journal+of+Biogeography-p-13652699
  last_verified: '2026-06-22'
  audience:
    value: Core readership is biogeographers, ecologists, evolutionary biologists, conservation biologists,
      botanists and zoologists; the editorial team is actively working to expand reach beyond these
      regular readers to other stakeholders such as policymakers. Decisions are made by a team of equal
      Senior Editors (no single EIC) backed by an Editorial Advisory Board.
    confidence: secondary
    source_url: https://onlinelibrary.wiley.com/doi/full/10.1111/jbi.14965
  writing_style:
    value: Research Articles use a structured abstract (<=300 words, with headings Aim, Location, Taxon,
      Methods, Results, Main conclusions) and conventional IMRaD headings (Introduction, Materials and
      Methods, Results, Discussion); main text should not exceed ~6,000 words. Synthesis articles may
      relax structure and run to ~10,000 words (or more if justified). Word counts assessed case-by-case
      on request.
    confidence: secondary
    source_url: https://onlinelibrary.wiley.com/page/journal/13652699/homepage/forauthors.html
  figure_preference:
    value: 'Research Articles are limited to roughly 2-3 pages of illustrative material (about 6 tables
      and figures total, including captions), accompanied by a structured abstract of <=300 words (headings:
      Aim, Location, Taxon, Methods, Results, Main conclusions). No distinctive display rules beyond
      standard Wiley figure guidance were confirmed; a mandatory graphical abstract could NOT be verified
      and was removed.'
    confidence: secondary
    source_url: https://onlinelibrary.wiley.com/page/journal/13652699/homepage/forauthors.html
  signals:
    value: 'Seven content types: Research Paper, Methods and Tools, Data, Synthesis, Perspective, Commentary
      and Correspondence. Tellingly, it brands reviews ''Synthesis'' not ''Review'' to demand an integrated
      understanding that resolves misunderstandings and apparent contradictions and often presents new
      conceptual frameworks (up to ~10,000 words). Perspectives are stimulating, reflective personal
      essays; Commentary gives light, jargon-free comment on the latest biogeography research, understandable
      to a general/undergraduate audience. Structured abstract required. Has a Judith Masters Fund supporting
      Global South authors.'
    confidence: secondary
    source_url: https://onlinelibrary.wiley.com/page/journal/13652699/homepage/guide.htm

