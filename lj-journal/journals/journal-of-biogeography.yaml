desk_reject_triggers:
  - "Over the 7000-word all-inclusive Research-Paper cap (remember JBI counts abstract AND the reference list inside the limit) → trim the text AND the reference list to fit ~10-12 published pages."
  - "Local / single-site descriptive inventory with no general biogeographic question or transferable insight → reframe around pattern-and-process at a biogeographic scale, or target a regional journal."
  - "Data and/or code not made available to reviewers at submission → deposit (Dryad 'Private for Peer Review' link, or Zenodo/GitHub/GBIF/TreeBASE) and provide the private URL."
  - "Structured abstract missing the required headings (Aim; Location; Taxon; Methods; Results; Main conclusions) or over 300 words → restructure to the headings."
  - "Sensitive species coordinates exposed → mask/coarsen localities of threatened or trafficked taxa and state that you did."
  - "Peer-review anonymity assumption wrong → JBI's review model is UNCONFIRMED this run (sisters GEB/D&D are double-blind); check the official page before deciding whether to anonymize."

