scope:
  value: >
    A leading international journal in conservation science. Publishes work across the biological,
    sociological, ethical and economic dimensions of conserving biological diversity — theoretical and
    empirical investigations of the consequences of human actions for the diversity, structure and
    function of terrestrial, freshwater and marine ecosystems (extinction risk, fragmentation, invasive
    species, conservation genetics, restoration). Strong appetite for policy- and practice-relevant
    conservation problems and solutions.
  confidence: secondary
  source_url: https://www.sciencedirect.com/journal/biological-conservation
  last_verified: 2026-06-22
# what THIS journal rewards + audience. AUTHORITATIVE sources only (official/editorial/society); null = no reliable source found, left blank by design.
taste:
  value: Biological Conservation rewards research that simultaneously advances conservation science
    AND delivers practical value for protecting and managing biodiversity — its stated goal is work
    whose findings are usable by the people doing protection and management on the ground. Its audience
    is therefore not scientists alone but also land/resource managers and the government and NGO officials
    who develop and implement policy. Editorially it prizes a clear, well-communicated message for a
    wide audience, backed by well-designed studies, explicit hypothesis testing, and rigorous analysis
    that acknowledges its own limits and uncertainty.
  confidence: official
  source_url: http://vincent.devictor.free.fr/Articles/Primack%20&%20Devictor_2018.pdf
  last_verified: '2026-06-22'
  audience:
    value: 'Conservation scientists plus practitioners and decision-makers: land/resource managers and
      government and NGO officials who develop and implement policy. The journal''s editorials frame
      its value as serving managers and policy makers, not scientists alone.'
    confidence: official
    source_url: http://vincent.devictor.free.fr/Articles/Primack%20&%20Devictor_2018.pdf
  writing_style:
    value: 'Prizes a clear, well-communicated message aimed at a wide audience, backed by rigorous methods:
      well-designed studies, clear hypothesis testing, and rigorous analysis that acknowledges its limits
      and sources of uncertainty.'
    confidence: official
    source_url: http://vincent.devictor.free.fr/Articles/Primack%20&%20Devictor_2018.pdf
  figure_preference:
    value: null
    confidence: unknown
    source_url: null
  signals:
    value: Applied/policy-facing content-type range (research articles, reviews including systematic
      reviews and perspectives, short communications, policy perspectives, letters to the editor) plus
      thematic special issues. A 2014 editorial explicitly elevated review articles, signaling appetite
      for synthesis with applications.
    confidence: secondary
    source_url: https://doi.org/10.1016/j.biocon.2014.09.012

