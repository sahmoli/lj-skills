desk_reject_triggers:
  - "Author identities left in the manuscript → DOUBLE-ANONYMIZED: upload a separate title page; strip names, affiliations AND acknowledgements from the main manuscript file."
  - "Over the word budget — refs + figures + tables ALL count, each fig/table = 300 words → recompute the real total (8000 research / 12000 review / 8000 perspective / 4000 short comm & policy / 800 correspondence) before submitting."
  - "Data not deposited / no data-availability statement (Option C is mandatory) → deposit in a repository, cite & link, or state a valid reason it cannot be shared."
  - "Missing Highlights (3–5 bullets, ≤85 chars each, separate file) → add; Elsevier-mandatory."
  - "Local/descriptive result with no clear conservation implication → reframe the conservation significance and real-world application; state it in the cover letter."
  - "Pure-opinion piece submitted as a Perspective or Policy Analysis → ground it in evidence/citations or it is rejected."

reporting:
  data_availability_statement:
    required: true
    confidence: official
    source_url: https://www.sciencedirect.com/journal/biological-conservation/publish/guide-for-authors
    last_verified: 2026-06-22
  data_repository:
    value: "Option C — REQUIRED to deposit research data in a relevant repository and cite/link it (or justify why not). Common: Dryad, Zenodo, Figshare, Mendeley Data."
    confidence: official
    source_url: https://www.sciencedirect.com/journal/biological-conservation/publish/guide-for-authors
    last_verified: 2026-06-22
  code_sharing:
    value: "Software/code/models/algorithms are treated as research data and fall under the Option C deposit requirement; cite with a persistent identifier (e.g. Zenodo)."
    confidence: official
    source_url: https://www.sciencedirect.com/journal/biological-conservation/publish/guide-for-authors
    last_verified: 2026-06-22
  reporting_guideline:
    value: "Reviews must include a literature-selection methods section; Systematic Reviews follow Collaboration for Environmental Evidence (environmentalevidence.org). SAGER guidelines for sex/gender-based analysis. No PRISMA-EcoEvo/ODMAP/STRANGE mandated on-page."
    confidence: official
    source_url: https://www.sciencedirect.com/journal/biological-conservation/publish/guide-for-authors
    last_verified: 2026-06-22
  sensitive_locality:
    value: "No explicit sensitive-species-locality masking rule on the guide. Maps must show only the area studied and carry the note 'map lines delineate study areas and do not necessarily depict accepted national boundaries' (jurisdictional neutrality). Mask precise localities of threatened/trafficked taxa as conservation best practice."
    confidence: secondary
    source_url: https://www.sciencedirect.com/journal/biological-conservation/publish/guide-for-authors
    last_verified: 2026-06-22
  orcid:
    value: "ORCID expected for authors (Elsevier Editorial Manager default; secondary sources list ORCID for all authors)"
    confidence: secondary
    source_url: https://manusights.com/blog/biological-conservation-submission-guide
    last_verified: 2026-06-22

ai_disclosure:
  placement: inherit                    # → elsevier: named 'Declaration of generative AI...' section at END, immediately ABOVE References, PUBLISHED. Confirmed verbatim on this journal's guide.
  block:
    value: >
      Section title: "Declaration of generative AI and AI-assisted technologies in the manuscript
      preparation process." Statement: "During the preparation of this work the author(s) used [NAME OF
      TOOL / SERVICE] in order to [REASON]. After using this tool/service, the author(s) reviewed and
      edited the content as needed and take(s) full responsibility for the content of the published
      article." Place in a new section before the reference list. Basic grammar/spell/reference-check
      tools are EXEMPT; if nothing to disclose, omit. AI cannot be an author. AI-generated images must
      also be disclosed in each affected figure caption.
    confidence: official
    source_url: https://www.sciencedirect.com/journal/biological-conservation/publish/guide-for-authors
    last_verified: 2026-06-22

