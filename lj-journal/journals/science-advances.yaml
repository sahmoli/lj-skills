scope:
  value: >
    The open-access multidisciplinary journal of AAAS / the Science family. Publishes original
    research representing a significant advance across the full range of natural sciences,
    physical sciences, engineering, computational, environmental and social sciences. As an
    ecology/conservation venue it rewards work whose significance reaches beyond a single
    subfield — broad, generalizable, mechanism- or theory-advancing science rather than local
    description. Companion to Science with a higher acceptance volume but the same prestige tier.
  confidence: secondary
  source_url: https://www.science.org/journal/sciadv
  last_verified: 2026-06-22
# what THIS journal rewards + audience. AUTHORITATIVE sources only (official/editorial/society); null = no reliable source found, left blank by design.
taste:
  value: Science Advances rewards work that significantly advances the boundaries of knowledge with
    impact that is "more than incremental," and whose significance is legible to readers outside its
    own field — its defining filter is cross-disciplinary reach. It is highly selective (rejecting roughly
    90%, many without review) and serves a broad, multidisciplinary scientific readership, with decisions
    made by active-scientist deputy/associate editors backed by leading-expert reviewers. Writing should
    be concise and framed for a general audience (overstatement is penalized; titles, abstracts and
    figure captions must be intelligible across disciplines), and figures plus self-explanatory captions
    carry heavy evaluative weight. As an open-access journal with flexible formats, it permits longer,
    deeper papers than Science.
  confidence: official
  source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11325918/
  last_verified: '2026-06-22'
  audience:
    value: Broad, multidisciplinary scientific readership. Editors deliberately select work readable
      beyond its own field. Decisions are made by deputy/associate editors who are active research scientists,
      supported by peer reviewers who are leaders in their fields.
    confidence: official
    source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11325918/
  writing_style:
    value: Concise and framed for a general scientific audience; abstracts should state why the work
      is interesting broadly. Overstatement is penalized and attention to detail (no typos/grammar errors)
      matters. Title, abstract and figure captions must be comprehensible to scientists in other disciplines.
    confidence: official
    source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11325918/
  figure_preference:
    value: 'Figures and captions carry heavy evaluative weight: the handling editor forms a second impression
      from them and many reviewers start there. Captions should be self-explanatory and intelligible
      to outside-field readers. Flexible/longer formats allow finer detail than Science.'
    confidence: official
    source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11325918/
  signals:
    value: Defining filter is cross-disciplinary reach ('entice readers outside your field') with more-than-incremental
      significance. Open-access journal using flexible formats that permit longer papers with greater
      depth than Science; explicitly welcomes cross-, inter-, and trans-disciplinary work across all
      of STEM and social sciences.
    confidence: official
    source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5462495/

