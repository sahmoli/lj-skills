desk_reject_triggers:
  - "Incremental or locally-scoped result with no general-science significance → reframe the broad 'why this matters to all of science' before submitting (this is the editorial bar)."
  - "Missing the mandatory <125-character one-sentence summary / teaser → manuscripts are returned without it."
  - "Abstract over 150 words, has subheadings, or contains citations → rewrite as a single citation-free general-readership paragraph."
  - "'Data available from the corresponding author on request' → NOT accepted; deposit all data in a public repository with accession numbers/DOIs BEFORE submission."
  - "Custom code central to the findings not deposited/shared → archive (e.g. Zenodo) and cite it."
  - "AI-generated figures/images included without prior editor permission → remove or obtain explicit advance approval from the handling editor."

reporting:
  data_availability_statement:
    required: true
    confidence: secondary               # Science journals editorial policy; science.org 403'd — corroborated by secondary sources
    source_url: https://www.science.org/content/page/science-journals-editorial-policies
    last_verified: 2026-06-22
  data_repository:
    value: "All data needed to evaluate the conclusions must be in the paper, the Supplementary Materials, OR a public repository with accession numbers/DOIs. Discipline repositories expected (GenBank/GEO/PDB/EMDB etc.); general repositories Dryad/Zenodo/Figshare for ecology data. 'Available on request' is explicitly NOT accepted."
    confidence: secondary
    source_url: https://www.science.org/content/page/science-journals-editorial-policies
    last_verified: 2026-06-22
  code_sharing:
    value: "Custom code/software central to the findings must be made available (deposit + cite, e.g. Zenodo/GitHub-with-archive)."
    confidence: secondary
    source_url: https://www.science.org/content/page/science-journals-editorial-policies
    last_verified: 2026-06-22
  reporting_guideline:
    value: "No ecology-specific checklist mandated (no PRISMA-EcoEvo/ODMAP/STRANGE requirement found). CONSORT/clinical-trial registration applies to trials; general statistical-reporting rigor expected."
    confidence: unknown
    source_url: https://www.science.org/content/page/science-journals-editorial-policies
    last_verified: 2026-06-22
  sensitive_locality:
    value: "No species-locality masking rule found specific to Science Advances; AAAS has a general dual-use-research-of-concern / biosecurity review process. Apply the conservation norm (mask precise localities of threatened/trafficked taxa) and verify with the editor."
