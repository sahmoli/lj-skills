ai_disclosure:
  placement: "Disclose in THREE places — the cover letter, the Acknowledgments (published, so it is visible in the article), AND Methods or Supplementary Materials. AI cannot be an author; AI-generated text allowed since Nov 2023 WITH disclosure; AI-generated figures/images PROHIBITED without explicit prior editor permission. (Override of the publisher_profiles[aaas] 'fetch separately' placeholder — but science.org 403'd this run, so secondary; verify on page.)"
  block:
    value: >
      Cover letter: "During preparation of this manuscript, we used [TOOL, e.g. ChatGPT (OpenAI) /
      Claude (Anthropic)] to assist with [task, e.g. language editing of the Results and Discussion].
      All AI-assisted text was reviewed, verified, and edited by the authors, who take full
      responsibility for the content." Acknowledgments (published): "The authors acknowledge the use
      of [TOOL] for [task] during manuscript preparation." Also document technical details in Methods
      or Supplementary Materials. (Science/AAAS policy: AI tools may not be authors; AI-generated
      images/figures require explicit advance editor approval.)
    confidence: secondary               # consistent across secondary sources; science.org editorial-policies page 403'd this run
    source_url: https://www.science.org/content/page/science-journals-editorial-policies
    last_verified: 2026-06-22

