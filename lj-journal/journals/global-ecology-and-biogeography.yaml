scope:
  value: >
    Macro-scale ecology and biogeography: ecological and biogeographical patterns and processes at large
    spatial, temporal and taxonomic scales. Welcomes broad-scale studies of the organization of ecological
    systems and assemblages, using macroecological methods, comparative analyses, meta-analyses and modelling
    to draw general, conceptual conclusions relevant to ecologists and biogeographers worldwide — NOT local
    or single-site description.
  confidence: secondary
  source_url: https://onlinelibrary.wiley.com/journal/14668238
  last_verified: 2026-06-22
# what THIS journal rewards + audience. AUTHORITATIVE sources only (official/editorial/society); null = no reliable source found, left blank by design.
taste:
  value: 'Global Ecology and Biogeography is the macroecology journal: it rewards work that uncovers
    broad, consistent patterns in the ecological characteristics of organisms and ecosystems across
    large spatial, temporal, or taxonomic scales, and it insists that papers be presented in a way that
    emphasizes their generality rather than the specific study system. Its audience is macroecologists
    and biogeographers working at broad scales, so studies must reach general, conceptual conclusions
    — favoring comparative analyses, meta-analyses, reviews, spatial analyses, and modelling. Practically,
    a Research Article runs ~5000 words with ~50 references and six to eight display pieces, and submissions
    carry a distinctive structured abstract (Motivation; Main types of variable contained; Spatial location
    and grain; Time period and grain; Major taxa and level of measurement; Software format) that forces
    explicit reporting of scale, grain, and taxon.'
  confidence: secondary
  source_url: https://onlinelibrary.wiley.com/page/journal/14668238/homepage/forauthors.html
  last_verified: '2026-06-22'
  audience:
    value: Macroecologists and biogeographers working at broad scales — researchers on global biodiversity
      patterns, species range/abundance, ecosystem responses to global change, and historical/evolutionary
      biogeography. Work is judged by a generality-focused, quantitative-pattern community.
    confidence: secondary
    source_url: https://onlinelibrary.wiley.com/page/journal/14668238/homepage/productinformation.html
  writing_style:
    value: Framing must foreground generality rather than the specific study system. Standard Research
      Article ~5000 words and ~50 references; structured abstract ≤300 words; required sections (abstract,
      introduction, methods, results, conclusions). Free Format submission allowed; references in any
      consistent style.
    confidence: secondary
    source_url: https://onlinelibrary.wiley.com/page/journal/14668238/homepage/forauthors.html
  figure_preference:
    value: Research Articles allow six to eight display pieces (tables and figures combined). Figures
      and tables must carry legends; figures should be uploaded at the highest resolution possible.
      Data Articles are capped at ~2000 words plus two figures.
    confidence: secondary
    source_url: https://onlinelibrary.wiley.com/page/journal/14668238/homepage/forauthors.html
  signals:
    value: 'Mandatory STRUCTURED ABSTRACT with fixed headings: Motivation; Main types of variable contained;
      Spatial location and grain; Time period and grain; Major taxa and level of measurement; Software
      format — forcing explicit scale/grain/taxon reporting. Article types include Perspective, Meta-analyses,
      Research Reviews, Method, Data Article, Correspondence.'
    confidence: secondary
    source_url: https://onlinelibrary.wiley.com/page/journal/14668238/homepage/forauthors.html

