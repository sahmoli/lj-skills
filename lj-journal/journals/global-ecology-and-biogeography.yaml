desk_reject_triggers:
  - "Scale too small / single-site or regional with no transferable general conclusion → reframe at macro/global scale or target a regional journal (Juan's own gate: '尺度够大吗')."
  - "Manuscript, acknowledgements, or the data/code-availability statement reveal author identity (GEB is double-anonymous) → fully anonymize, put names+affiliations+ORCID on a SEPARATE title-page file, keep the data/code statement author-blind."
  - "Abstract not structured to the required headings or over ~300 words → restructure (Aim; Location; Time period; Major taxa studied; Methods; Results; Main conclusions)."
  - "No data- and code-availability statement, or data not deposited in a stable public repository before review → deposit (Dryad/Zenodo/GBIF/TreeBASE) and add an anonymized statement."

