scope:
  value: >
    Promotes the development of NEW methods across ecology and evolutionary biology
    (analytical, practical, or conceptual) and accelerates their dissemination and uptake
    by the research community. Strong preference for methods demonstrably applicable
    BROADLY across taxa or systems; emphasises description and validation of the novel
    method itself (not merely applying an existing technique), with accessible
    implementation (open code, packages, worked examples, vignettes). New computational
    methods normally must be tested with simulations or benchmark datasets.
  confidence: secondary
  source_url: https://besjournals.onlinelibrary.wiley.com/hub/journal/2041210x/aims-and-scope/read-full-aims-and-scope
  last_verified: 2026-06-22
# what THIS journal rewards + audience. AUTHORITATIVE sources only (official/editorial/society); null = no reliable source found, left blank by design.
taste:
  value: 'MEE rewards papers whose center of gravity is the description and analysis of a NEW method
    — analytical, practical, or conceptual — rather than the results of applying one; the method must
    be broadly applicable across taxa or systems, so a tool demonstrated on a single group must argue
    cross-taxon generality. It deliberately serves a dual audience: both the developers of methods and
    the users/practitioners who apply them, drawn together from previously disparate sub-disciplines
    into a single forum for tracking methodological developments. Writing is expected to be clear, concise,
    and accessible (accessibility is treated as central to method uptake), with figures that convey
    the key result at a glance. A distinctive structural signal is the named ''Applications'' article
    type for new open-source software, requiring a worked example/vignette and a mandatory open-source
    license.'
  confidence: secondary
  source_url: https://besjournals.onlinelibrary.wiley.com/hub/journal/2041210x/aims-and-scope/read-full-aims-and-scope
  last_verified: '2026-06-22'
  audience:
    value: Both developers of new methods and the users/practitioners who apply them, drawn from previously
      disparate sub-disciplines across ecology and evolutionary biology, served by a single cross-cutting
      forum for tracking methodological developments.
    confidence: secondary
    source_url: https://besjournals.onlinelibrary.wiley.com/doi/10.1111/j.2041-210X.2010.00016.x
  writing_style:
    value: Clear, concise, accessible prose. Title brief and clear; abstract digestible within strict
      word limit; methods may use jargon to stay concise but must stay comprehensible; each paragraph's
      first sentence signals its topic. Accessibility is treated as central to method uptake.
    confidence: secondary
    source_url: https://besjournals.onlinelibrary.wiley.com/hub/journal/2041210X/journal-resources/guide-to-scientific-writing
  figure_preference:
    value: Use figures and tables strategically to cut lengthy explanation; the best figures convey
      the key result at a glance. Use a figure or table whenever a text section would be better presented
      visually; tables suit summary/auxiliary data.
    confidence: secondary
    source_url: https://besjournals.onlinelibrary.wiley.com/hub/journal/2041210X/journal-resources/guide-to-scientific-writing
  signals:
    value: 'Named ''Applications'' article type: short (3000-4000 word) descriptions of new open-source
      software, requiring at least one worked example (vignette strongly encouraged) and a mandatory
      open-source license; standard IMRaD structure not required. Other types: hardware/tool notes,
      reviews, perspectives.'
    confidence: secondary
    source_url: https://besjournals.onlinelibrary.wiley.com/hub/journal/2041210x/features/applicationpapers

