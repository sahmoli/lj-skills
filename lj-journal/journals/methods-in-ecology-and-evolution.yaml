    value: "Curated, version-controlled DOI-minting archive (Dryad or Zenodo). At submission supply an anonymised private-for-peer-review link OR upload files (zip/CSV/txt/md/rmd); list database + accession/DOI; formal Data Availability Statement added at acceptance. Personal GitHub/website does NOT count as a permanent archive."
