desk_reject_triggers:
  - "Author-identifying text/SI breaks DOUBLE-anonymous review → anonymise all self-references ('a previous study by X et al', not 'our previous study'), mask repo/CRAN links and permit numbers."
  - "Method works for only a single taxon/ecosystem → demonstrate broad applicability across taxa or systems, or it is unlikely to be considered a 'new method'."
  - "Submission is just a workflow chaining existing methods sent as a Research Article → reframe as a genuine new method, or use the dedicated Workflow type."
  - "Over the word cap — remember it INCLUDES references + tables + figure captions + statements → trim to the type limit (RA 7000-8000; Review 10000-12500; Perspective 5000; Application 4000; Practical Tools 3000-4000; Forum ~1000)."
  - "No code/data available for peer review in anonymised form → upload a zip/CSV/txt or a private-for-peer-review Dryad/Zenodo link, noted under the Abstract; Applications must add a Code Checklist."
  - "New computational method with no simulation/benchmark testing → add simulation tests (describe simulations before any empirical use)."

