ai_disclosure:
  placement: "Methods section"          # OVERRIDE of wiley_bes default (Methods OR Acknowledgements): MEE has an EXPLICIT on-page rule putting AI/LLM disclosure in METHODS.
  block:
    value: >
      MEE explicit rule: "If LLMs or other comparable AI tools are used to produce the work
      described in a manuscript, there must be a clear statement to that effect in the Methods
      section of the manuscript, and the corresponding or senior author must take responsibility
      for any code (or text) generated by the AI platform... The application name and version also
      should be reported, and code generated by the LLM/AI should be annotated to that effect."
      Paste-in: "We used [TOOL name + version] to [role, e.g. generate/assist code] on [date].
      AI-generated code is annotated as such; the corresponding author takes full responsibility
      for all AI-generated code and text." (Wiley/COPE: generative AI cannot be an author.
      Pure grammar/spell-check tools such as Writefull need no Methods statement.)
    confidence: secondary
    source_url: https://besjournals.onlinelibrary.wiley.com/hub/journal/2041210x/author-guidelines
    last_verified: 2026-06-22

