desk_reject_triggers:
  - "Significance Statement missing, >120 words, or jargon-dense → write a 50–120-word statement aimed at a general scientific reader."
  - "Final typeset article over the page budget → trim to ~6 pages or plan for ~$375/extra page (hard cap 12 pages)."
  - "Narrow / incremental single-field result with no broad significance → reframe broad importance or pick a specialty journal."
  - "Data/code 'available upon request', missing accession numbers, or proprietary restrictions → deposit in a FAIR public repository before acceptance (enforced at acceptance)."
  - "AI/LLM use in drafting/editing not disclosed in Methods (or Acknowledgments) with tool + version → add the disclosure; AI cannot be an author."

