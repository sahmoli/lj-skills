open_access:
  value: >
    hybrid — subscription journal with paid immediate-OA option (CC BY / CC BY-NC / CC BY-ND).
    All articles become free 6 months after publication (delayed OA). Brief Reports are always
    immediately OA. Did NOT transition to full OA in Jan 2025 — remains hybrid.
  confidence: secondary
  source_url: https://www.pnas.org/author-center/publication-charges
  last_verified: 2026-06-22
apc_usd:
  value: >
    2025 (vol. 122) rates: immediate OA $4,975 WITH institutional site license / $5,475 without;
    delayed OA $2,575. Plus EXCESS-PAGE charge ~$375 per typeset page over the limit (billed at acceptance,
    based on production layout not manuscript page count).
  confidence: secondary
  source_url: https://www.pnas.org/author-center/publication-charges
  last_verified: 2026-06-22

review_model:
  value: >
    single_anonymized for Direct Submissions (reviewer names confidential unless reviewer consents);
    Contributed Submissions (sponsored by an NAS member) use OPEN/named peer review. Overrides nothing —
    matches publisher default but the Contributed open-review track is PNAS-specific.
  confidence: secondary
  source_url: https://www.pnas.org/author-center/editorial-and-journal-policies
  last_verified: 2026-06-22

scope:
  value: >
    Multidisciplinary flagship publishing high-impact original research across the biological, physical,
    and social sciences, plus Perspectives, Reviews and Colloquium papers. Rewards work of broad significance
    that is accessible and important to a general scientific audience — not narrow single-field incremental results.
  confidence: secondary
  source_url: https://www.pnas.org/author-center/submitting-your-manuscript
  last_verified: 2026-06-22
# what THIS journal rewards + audience. AUTHORITATIVE sources only (official/editorial/society); null = no reliable source found, left blank by design.
taste:
  value: PNAS rewards high-impact, original research of broad significance that spans the biological,
    physical, and social sciences, prizing demonstrable impact and cross-disciplinary breadth over narrow
    specialist advances. Its audience is a broad, multidisciplinary scientific readership worldwide
    (plus interested nonspecialists), with editorial decisions guided by NAS members who value the journal's
    breadth of coverage. A defining feature is the mandatory 120-word Significance Statement, written
    so an undergraduate-educated scientist outside the field can grasp why the work matters — the key
    gate for articulating broad impact.
  confidence: secondary
  source_url: https://www.pnas.org/about
  last_verified: '2026-06-22'
  audience:
    value: A broad, multidisciplinary scientific readership across the biological, physical, and social
      sciences worldwide, plus interested nonspecialists. Editorial decisions are made by NAS members,
      scientific leaders who value the journal's breadth of coverage.
    confidence: secondary
    source_url: https://www.pnas.org/doi/10.1073/pnas.0800528105
  writing_style:
    value: Mandatory 120-word Significance Statement must explain the work's importance to nonspecialists,
      written for an undergraduate-educated scientist outside the field; avoid jargon, references, numbers,
      and acronyms.
    confidence: secondary
    source_url: https://www.pnas.org/author-center/submitting-your-manuscript
  figure_preference:
    value: 'Per Digital Art Guidelines: submit TIFF, EPS, or PDF; color files in original RGB; line
      art 1000-1200 ppi, combination halftones 600-900 ppi, halftones minimum 300 ppi at publication
      size; vector text preferred, at least 6 points after reduction.'
    confidence: secondary
    source_url: https://www.pnas.org/pb-assets/authors/digitalart-1675347574760.pdf
  signals:
    value: Mandatory 120-word Significance Statement printed on the article's first page (a defining
      PNAS feature signaling broad-impact framing). Plus distinct submission tracks (Direct Submission,
      Member-Contributed) under NAS-member editing.
    confidence: secondary
    source_url: https://www.pnas.org/doi/10.1073/pnas.1509912112

