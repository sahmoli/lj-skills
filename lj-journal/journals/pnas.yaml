ai_disclosure:
  placement: "Materials and Methods section (or Acknowledgments if no Materials and Methods section is available)"  # PNAS-specific override; publisher_profiles[pnas] said 'fetch separately'. Recovered from PNAS's own quoted policy text (page 403 to bots) → secondary; confirm live.
  block:
    value: >
      "The authors used [TOOL NAME and specific model/version, e.g. GPT-4 / Claude 3.5 Sonnet] during the
      preparation of this manuscript to [REASON, e.g. draft/edit text]. The authors reviewed and fact-checked
      all output and take full responsibility for the content of the publication." Disclose in Materials and Methods
      (or Acknowledgments if no Methods). AI/LLMs may NOT be listed as authors. AI-generated images/graphics are NOT
      permitted (incl. cover art) unless the software itself is the subject of the work.
    confidence: secondary
    source_url: https://www.pnas.org/post/update/pnas-policy-for-chatgpt-generative-ai
    last_verified: 2026-06-22

