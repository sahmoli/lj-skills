desk_reject_triggers:
  - "No substantive cross-disciplinary integration / no significant conceptual advance → reframe around an integrated socio-environmental question, not a single-discipline result."
  - "Missing or weak 'Science for Society' box (≤1,000 chars) → it is MANDATORY on research articles; write a jargon-free societal-relevance + pathways-forward statement."
  - "Describes the problem but offers no solution or pathway forward → add explicit solution-orientation (Commentaries especially must discuss solutions)."
  - "Over ~5,000 words (excl. methods/refs) or >7 display items → trim to the format before submitting."
  - "No data- AND code-availability statements with deposit accessions → stage public-repository deposits at first submission."
  - "Unsolicited Review/Perspective without a fit check → most are commissioned; send a presubmission inquiry / short synopsis first."

reporting:
  data_availability_statement:
    required: true
    confidence: official
    source_url: https://www.cell.com/one-earth/information-for-authors
    last_verified: 2026-06-22
  data_repository:
    value: "Public repository with accession numbers required; deposit data (and metadata) for editorial/peer review at submission. Env-data repos: Dryad/Zenodo/Figshare; domain-specific archives where they exist."
    confidence: secondary
    source_url: https://www.cell.com/one-earth/information-for-authors
    last_verified: 2026-06-22
  code_sharing:
    value: "Code-availability statement required; deposit code with a persistent identifier (Zenodo/GitHub-archived) where computation underlies the results"
    confidence: official
    source_url: https://www.cell.com/one-earth/information-for-authors
    last_verified: 2026-06-22
  reporting_guideline:
    value: "No ecology-specific guideline mandated (no PRISMA-EcoEvo/ODMAP/STRANGE requirement found). Cell Press expects Sex- and Gender-Based Analysis (SGBA) reporting where relevant; One Earth does NOT use STAR Methods."
    confidence: secondary
    source_url: https://www.cell.com/one-earth/information-for-authors
    last_verified: 2026-06-22
  sensitive_locality:
    value: "No explicit species-coordinate masking policy found; general Cell Press 'sensitive human data' policy applies. VERIFY whether threatened-taxa localities must be masked."
    confidence: unknown
    source_url: https://www.cell.com/one-earth/information-for-authors
    last_verified: 2026-06-22
  orcid:
    value: "ORCID required for the corresponding author (Cell Press/Elsevier default); iDs in the author byline"
    confidence: secondary
    source_url: https://www.cell.com/one-earth/information-for-authors
    last_verified: 2026-06-22

ai_disclosure:
  placement: inherit                    # → elsevier: named section "Declaration of generative AI and AI-assisted technologies in the writing process", at END immediately ABOVE References, PUBLISHED in the article. One Earth lists exactly this section (confirmed).
  block:
    value: >
      "During the preparation of this work the author(s) used [NAME TOOL / SERVICE] in order to
      [REASON, e.g. improve the language and readability]. After using this tool/service, the author(s)
      reviewed and edited the content as needed and take(s) full responsibility for the content of the
      publication." Place under the header "Declaration of generative AI and AI-assisted technologies in
      the writing process" immediately before the References. Required regardless of task; standard
      grammar/spell checkers are EXEMPT; AI cannot be an author. (Generative-AI-created/altered images
      are not permitted unless part of the research methods and disclosed.)
    confidence: official
    source_url: https://www.elsevier.com/about/policies-and-standards/the-use-of-generative-ai-and-ai-assisted-technologies-in-writing-for-elsevier
    last_verified: 2026-06-22

