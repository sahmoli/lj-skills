scope:
  value: >
    Cell Press' flagship sustainability journal. Publishes high-quality research and perspectives that
    significantly advance our ability to understand and address today's sustainability challenges across
    the natural, social, and applied sciences and the humanities. Monthly thematic issues; spans
    biodiversity & ecosystem services, climate adaptation/mitigation, food/water/energy systems,
    land-use change, governance & policy, sustainable development. Disciplinary work considered, but
    cross-disciplinary submissions with a significant conceptual advance are particularly encouraged.
  confidence: official
  source_url: https://www.cell.com/one-earth/information-for-authors
  last_verified: 2026-06-22
# what THIS journal rewards + audience. AUTHORITATIVE sources only (official/editorial/society); null = no reliable source found, left blank by design.
taste:
  value: 'One Earth rewards work that delivers a significant conceptual advance across the full spectrum
    of environmental change and sustainability, with an explicit editorial appetite for cross- and transdisciplinary
    research (especially projects involving end users at the design stage) and transformative solutions
    over narrow disciplinary studies. It is deliberately a single journal for a diverse audience, uniting
    the natural, social, and applied sciences, and is written to reach non-experts and decision makers.
    Its defining structural tell is the mandatory plain-language "Science for Society" box on every
    research article, which must be jargon-free and propose transdisciplinary pathways forward.'
  confidence: secondary
  source_url: https://crosstalk.cell.com/blog/a-qa-with-lewis-collins-the-editor-in-chief-of-one-earth
  last_verified: '2026-06-22'
  audience:
    value: A single journal with a deliberately diverse audience uniting the natural, social, and applied
      sciences; also explicitly written for non-experts and decision makers via the mandated plain-language
      societal-impact statement.
    confidence: official
    source_url: https://crosstalk.cell.com/blog/a-qa-with-lewis-collins-the-editor-in-chief-of-one-earth
  writing_style:
    value: The mandatory "science for society" statement must be jargon-free and understandable to a
      non-scientist (1-2 paragraphs, max ~300 words), translating societal relevance and impact for
      broad audiences. No broader prose-style mandate stated beyond this accessibility requirement.
    confidence: secondary
    source_url: https://www.cell.com/one-earth/information-for-authors/article-types
  figure_preference:
    value: 'Only formatting guidance located: at final submission, main figures/schemes are not embedded
      in the main document and figure legends are provided as one consolidated list (not interspersed
      in text). No stated aesthetic or display-item taste preference.'
    confidence: secondary
    source_url: https://www.cell.com/one-earth/information-for-authors/final-submission
  signals:
    value: 'Signature mandatory "Science for Society" box on all research articles: a plain-language
      statement of societal relevance/impact (positive or negative) that proposes transdisciplinary
      pathways forward. This box is the journal''s defining structural tell of its applied, decision-relevant
      ambitions.'
    confidence: secondary
    source_url: https://www.cell.com/one-earth/information-for-authors/article-types

