desk_reject_triggers:
  - "Insufficient novelty / merely incremental or descriptive / narrow single-system result with no general ecological advance → reframe around a clear conceptual contribution; otherwise this journal will desk-reject (60-70% desk-reject rate)."
  - "No explicit, strong take-home message → front-load the one-sentence 'what's new and why it matters for ecology broadly'."
  - "Letter main text over 5000 words or >6 figures/tables/boxes (or >50 refs) → trim to format BEFORE submitting."
  - "Submitting a Reviews & Syntheses or Ideas & Perspectives without the required 300-word pre-submission proposal/approval → email the editorial office first."
  - "No data accessibility statement, or data/code not deposited (and not accessible to editors/reviewers at submission) → stage Dryad/Figshare/Zenodo deposit now; code is also required."
  - "Technical Comment targeting a paper older than 6 months, or over 800 words/15 refs → out of window/format."

