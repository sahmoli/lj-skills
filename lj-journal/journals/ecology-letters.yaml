scope:
  value: >
    Rapid publication of the most novel, conceptually important research across all areas of ecology —
    population, community, ecosystem, evolutionary, theoretical, and global-change ecology, all taxa/biomes/regions.
    Prioritises hypothesis-driven, synthetic, idea-advancing work likely to shape the direction of the field;
    purely descriptive, local, or incremental studies are out of scope.
  confidence: secondary
  source_url: https://onlinelibrary.wiley.com/journal/14610248
  last_verified: 2026-06-22
# what THIS journal rewards + audience. AUTHORITATIVE sources only (official/editorial/society); null = no reliable source found, left blank by design.
taste:
  value: 'Ecology Letters rewards the most novel research of general importance across the ecological,
    evolutionary and environmental sciences, where novelty means work that transforms how we think about
    an important scientific question. Manuscripts are explicitly judged on general applicability to
    other species and systems and on interest to a broad range of ecologists, making the journal highly
    selective. Beyond standalone Letters, it cultivates two signature taste-defining formats: Ideas
    and Perspectives (new, critical topics and emerging frameworks) and Reviews and Syntheses (probing
    literature reviews and, where possible, meta-analyses), both space-limited and competitive. It demands
    writing that clearly and accurately communicates every part of the study, and asks authors to establish
    novelty and generality up front in a short (~1-page) cover-letter exposé with citations.'
  confidence: official
  source_url: https://www.blackwellpublishing.com/pdf/ele_editorial.pdf
  last_verified: '2026-06-22'
  audience:
    value: Broad community of ecologists across subfields. The journal assesses whether work has general
      applicability to other species and systems and interest to a range of ecologists; the Ideas and
      Perspectives format exists partly to reach beyond specialized audiences.
    confidence: official
    source_url: https://www.blackwellpublishing.com/pdf/ele_editorial.pdf
  writing_style:
    value: Demands clear, accurate, self-contained writing so reviewers can assess every part of the
      study; lack of clarity is cited as a common reason work fails to get a quality review. Authors
      must establish novelty and generality up front, including a short (~1-page) cover-letter exposé
      with citations showing how the study stands apart from past research.
    confidence: official
    source_url: https://www.blackwellpublishing.com/pdf/ele_editorial.pdf
  figure_preference:
    value: 'Display items are capped and counted together. Letters: max ~5000 words and 6 figures, tables
      or text boxes (abstract <=150 words). Ideas and Perspectives: max ~7500 words and 10 figures,
      tables or boxes (abstract <=200 words). This is structural display-item guidance rather than an
      aesthetic figure-style preference.'
    confidence: secondary
    source_url: https://onlinelibrary.wiley.com/page/journal/14610248/homepage/forauthors.html
  signals:
    value: 'Named article types reveal the journal''s taste: Letters (concise original research), Ideas
      and Perspectives (a venue to formally present new, critical topics and emerging frameworks that
      might otherwise be neglected or confined to specialized audiences), and Reviews and Syntheses
      (learned insights into active areas, including probing literature reviews and, where possible,
      meta-analyses). The two non-Letters sections are space-limited and very competitive; authors are
      urged to contact the section editors with proposals.'
    confidence: official
    source_url: https://www.blackwellpublishing.com/pdf/ele_editorial.pdf

