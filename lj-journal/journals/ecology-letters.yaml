ai_disclosure:
  placement: inherit                   # → wiley: Methods OR Acknowledgements (publisher_profiles[wiley])
  block:
    value: >
      "During the preparation of this work the author(s) used [TOOL/SERVICE incl. version + access date] in order to
      [REASON, e.g. improve language and readability]. After using this tool/service, the author(s) reviewed and
      edited the content as needed and take(s) full responsibility for the content of the publication."
      (Wiley/COPE: generative AI cannot be listed as an author; routine grammar/spell/editing tools are exempt.)
    confidence: official
    source_url: https://authorservices.wiley.com/ethics-guidelines/index.html
    last_verified: 2026-06-22

