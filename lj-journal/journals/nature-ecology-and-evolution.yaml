desk_reject_triggers:
  - "Incremental / narrowly specialist study with no concept advance → reframe for broad eco-evo significance or send to a specialist venue; NEE wants paradigm-shifting stories."
  - "Article main text over 3,500 words (Methods are EXCLUDED here, unlike GCB) or >6 display items → trim to format; move detail to Extended Data (≤10) / SI."
  - "No data availability statement, or data/code not deposited & available to editors+reviewers at submission → stage repository deposit (figshare/Dryad/Zenodo, accession codes) before submitting."
  - "Choosing double-anonymized review but leaving author identities in the manuscript → put names/affiliations in the cover letter only."
  - "Submitting a Review/Perspective/Comment expecting Gold OA → those non-primary types are subscription-only, NOT OA-eligible."

