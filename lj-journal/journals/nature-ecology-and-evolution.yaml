scope:
  value: >
    The full spectrum of ecological and evolutionary biology — how biodiversity arose, is
    maintained, what its consequences are, and how to conserve it — spanning molecular,
    organismal, population, community and ecosystem levels, plus relevant parts of the social
    sciences. A unified forum where researchers AND policymakers across all of life's diversity
    learn about and debate the most accomplished and significant advances in the field.
  confidence: official
  source_url: https://www.nature.com/natecolevol/aims
  last_verified: 2026-06-22
# what THIS journal rewards + audience. AUTHORITATIVE sources only (official/editorial/society); null = no reliable source found, left blank by design.
taste:
  value: 'Nature Ecology & Evolution rewards original research whose conclusions represent a substantial
    advance on an important problem and carry immediate, far-reaching implications across the full spectrum
    of ecology and evolution, with biodiversity as the unifying thread. It is written for a broad cross-disciplinary
    readership: a high editorial priority is that every paper be accessible to non-specialists, and
    manuscripts undergo substantial editing — plus copy and art editing — so text and figures read clearly
    to those outside the field. Figure guidance beyond this clarity/accessibility mandate is not specified
    on the public pages.'
  confidence: secondary
  source_url: https://www.nature.com/natecolevol/content
  last_verified: '2026-06-22'
  audience:
    value: Broad cross-disciplinary readership across all of ecology and evolutionary biology; a high
      editorial priority is that all papers be accessible to non-specialists, with manuscripts subject
      to substantial editing to achieve this.
    confidence: secondary
    source_url: https://www.nature.com/natecolevol/content
  writing_style:
    value: Expects accessible, non-specialist-friendly prose; manuscripts undergo substantial editing,
      and after acceptance a copy editor and an art editor may make further changes so text and figures
      are readable to those outside the field and conform to house style.
    confidence: secondary
    source_url: https://www.nature.com/natecolevol/content
  figure_preference:
    value: 'No detailed figure-style spec beyond a clarity/accessibility mandate: after acceptance an
      art editor may revise figures so they are readable and clear to readers outside the field.'
    confidence: secondary
    source_url: https://www.nature.com/natecolevol/content
  signals:
    value: Biodiversity is framed as the single word uniting the journal's interests, with conservation
      and policy relevance explicitly courted; the journal's accessibility-first editorial stance is
      its defining signal.
    confidence: secondary
    source_url: https://www.nature.com/articles/s41559-016-0042

