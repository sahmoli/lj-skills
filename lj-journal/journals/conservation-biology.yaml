  # OF THE ABSTRACT through the Acknowledgments and INCLUDES the abstract; the CURRENT (Feb2019)
  # revision EXCLUDES the reference list (Literature Cited), table/figure legends, and table body
  # text. (The Sep2014 PDF I read counted Literature Cited IN; this was relaxed in the 2019 update.)
  # Manuscripts substantially exceeding the cap are not sent for review.
