desk_reject_triggers:
  - "Manuscript substantially exceeds the per-type word cap (e.g., Contributed Paper >6000) → trim to cap BEFORE submission; over-length papers are not sent for review."
  - "Author/institution identity discoverable in the manuscript or data files (double-anonymous journal) → move all identifying info to a SEPARATE cover page; mask data; do not cite your own preprint."
  - "Local single-site/single-species result with no conservation relevance that transcends the case → reframe the transferable 'so what' for conservation."
  - "Missing data-availability statement / data not archived in a public repository → add the statement and deposit (mask sensitive localities)."
  - "Combined sections (e.g., Results & Discussion), a Conclusion section, or numbered headings → use fixed Abstract-Intro-Methods-Results-Discussion order, no Conclusion, unnumbered headings."
  - "Fewer than the required ~4 suggested reviewers / no separate cover page → supply ≥4 potential reviewers and the cover page."

