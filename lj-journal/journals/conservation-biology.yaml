scope:
  value: >
    Publishes research and commentary that advance the science and practice of conserving Earth's
    biological diversity, across any ecosystem or geographic region. Prioritizes manuscripts whose
    conservation relevance TRANSCENDS a particular species, ecosystem, or situation — documenting
    biodiversity, investigating human influence on species/ecosystems, and applying practical
    approaches to prevent extinction. Manuscripts judged on sound science and reasoning; English
    expression is explicitly not an impediment (free substantive editing for accepted papers).
  confidence: official
  source_url: https://conbio.org/publications/conservation-biology
  last_verified: 2026-06-22
# what THIS journal rewards + audience. AUTHORITATIVE sources only (official/editorial/society); null = no reliable source found, left blank by design.
taste:
  value: 'Conservation Biology, the flagship journal of the Society for Conservation Biology, rewards
    globally relevant, novel, and transferable work that develops new theory and methods, defines key
    problems, and proposes solutions for conserving Earth''s biological diversity. Its decisive filter
    is generalizability: conservation relevance must transcend the particular ecosystem, species, or
    situation, and manuscripts limited to a single species or location are rarely sent for review. It
    serves a worldwide community of conservation scientists and practitioners across any ecosystem or
    region. Stylistically it enforces a tight, IMRaD discipline (clear non-hanging titles, a 300-word
    mini-version abstract, name-year citations) and strict display-item economy (no more than one table/figure
    per four pages), with a defined article taxonomy and word caps signaling expected depth.'
  confidence: official
  source_url: https://conbio.org/publications/conservation-biology
  last_verified: '2026-06-22'
  audience:
    value: Positioned as the leading global journal in conservation, owned by the Society for Conservation
      Biology; serves the worldwide conservation research community, academics and practitioners, addressing
      the science and practice of conserving Earth's biological diversity across any ecosystem or region.
    confidence: official
    source_url: https://conbio.org/publications/conservation-biology
  writing_style:
    value: Titles must be clear, concise, never hanging (colon/dash), complete sentences, or interrogative.
      Abstract is a miniversion of the paper (Intro/Methods/Results/Discussion, max 300 words), no citations
      or 'We discuss' phrasing. IMRaD order, no Conclusion section, no numbered headings, name-year
      citations oldest-to-newest, no footnotes.
    confidence: official
    source_url: https://conbio.org/images/content_publications/ConsBiol_Author_Style_Guide_Sep2014.pdf
  figure_preference:
    value: 'Strict economy of display items: no more than one table or figure per four pages of text;
      few-data-point items must be folded into text. Figures self-explanatory, clear at 60% reduction,
      >=300 dpi (600 for lettering). Color discouraged (gray-scale must be distinguishable); maps need
      scale bars and compass; table legends one sentence, no bold, no gridlines.'
    confidence: official
    source_url: https://conbio.org/images/content_publications/ConsBiol_Author_Style_Guide_Sep2014.pdf
  signals:
    value: 'Defined article taxonomy with word caps signaling expected depth: Contributed Papers 6000,
      Reviews 7500, Essays 6000, Research Notes 3000, Conservation Practice and Policy 5000, Comments
      2000, Diversity 2000, Letters 1000 (abstract <=300 words). ''Essays'' and ''Diversity'' sections
      reveal appetite for opinion/philosophical and human-dimensions pieces. Single-species/single-location
      desk-reject signal. (Caps are from the 2014 style guide; current Wiley guidance may differ, so
      treat as indicative of the depth-vs-volume philosophy.)'
    confidence: official
    source_url: https://conbio.org/images/content_publications/ConsBiol_Author_Style_Guide_Sep2014.pdf

