ai_disclosure:
  placement: inherit                    # → wiley: Methods OR Acknowledgements (Wiley does not mandate one fixed section)
  block:
    value: >
      "During the preparation of this work the author(s) used [TOOL/SERVICE] in order to
      [REASON, e.g. improve language and readability]. After using this tool/service, the author(s)
      reviewed and edited the content as needed and take(s) full responsibility for the content of
      the publication." (Wiley/COPE: disclose tool + version + access date + role + how output was
      verified; grammar/spell/general-editing tools exempt; generative AI cannot be listed as an author.)
    confidence: official
    source_url: https://authorservices.wiley.com/ethics-guidelines/index.html
    last_verified: 2026-06-22

