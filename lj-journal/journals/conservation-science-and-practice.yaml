desk_reject_triggers:
  - "Manuscript exceeds the per-type word cap (e.g., Contributed Paper >7000) → trim to cap BEFORE submission; over-length manuscripts are RETURNED to authors for reduction before review."
  - "No clear, DIRECT, EXPLICIT application to conservation practice/policy/planning for a particular species, place or social context (SCB chart Gate 3) → make the practitioner usefulness explicit; CSP does NOT require novelty/general relevance, but it DOES require usefulness to practitioners/policy makers."
  - "Target audience not named → CSP asks authors to identify whether they write for other researchers or for practitioners; state it in the cover letter / framing."
  - "Purely descriptive, no clear research question, or weak methods/data/analysis → fails SCB Gate 1/2 (rigor is still required even though broad relevance is NOT) → not an SCB journal."
  - "Author/institution identity discoverable (review model appears DOUBLE-anonymous — secondary) → anonymize the manuscript and put identifying info on a separate title page; mask identity in shared data. (Confirm review model on the live Wiley page.)"
  - "No data-availability statement / data not in a public repository → add the statement and deposit (Dryad/Zenodo/Figshare); gold-OA Wiley journal expects open data."
  - "Sensitive species localities exposed → mask/coarsen precise locations and state that you did."

