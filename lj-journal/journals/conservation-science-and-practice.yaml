scope:
  value: >
    Publishes papers that address the policy, planning, and practice of conserving biological diversity.
    Aimed at bridging the knowledge–action gap by providing a venue for scientists to inform practitioners
    and vice versa; explicitly encourages submissions that LINK SCIENCE TO PRACTICE and connect findings to
    real conservation outcomes (which strategies work, and which fail). Unlike its sibling Conservation
    Biology, CSP WELCOMES applied/case-specific work that does NOT transcend a particular species, ecosystem,
    or situation — provided methods are rigorous and the work is directly useful to practitioners/policy
    makers. It is the SCB decision-chart TERMINAL for the applied/local branch (Gate 3; see
    routing/scb-where-to-send.md).
  confidence: official
  source_url: https://conbio.org/publications/conservation-science-and-practice/
  last_verified: 2026-06-22
# what THIS journal rewards + audience. AUTHORITATIVE sources only (official/editorial/society); null = no reliable source found, left blank by design.
taste:
  value: >
    Conservation Science and Practice rewards rigorous, USEFUL applied work that links science to on-the-ground
    practice, policy, and planning — explicitly including case-specific and regional studies that do NOT
    transcend a particular species, ecosystem, or situation (exactly the work Conservation Biology turns away
    for lack of generality). The decisive filter is not novelty or big-picture transferability but demonstrable
    relevance and usefulness to practitioners and policy makers, and a clear link from findings to conservation
    OUTCOMES (what works, and what fails). It serves a DUAL audience of researchers and conservation
    practitioners, and uniquely asks authors to name which audience they are writing for. Its distinctive
    "Evidence" article type — short communications reporting the outcomes of real conservation interventions,
    policy development and planning — embodies the journal's knowledge–action-gap mission.
  confidence: official
  source_url: https://conbio.org/publications/conservation-science-and-practice/
  last_verified: '2026-06-22'
  audience:
    value: >
      Explicitly DUAL: researchers AND conservation practitioners. The journal is "aimed at bridging the
      knowledge action gap by providing a venue for scientists to inform practitioners and vice versa," and
      "encourage[s] authors to identify their target audience, whether it be other researchers or conservation
      practitioners."
    confidence: official
    source_url: https://conbio.org/publications/conservation-science-and-practice/
  writing_style:
    value: >
      Practice-facing and outcome-oriented: authors are asked to connect findings to conservation outcomes and
      to state explicitly how the work is useful to practitioners/policy makers, and to name their target
      audience. Established methods applied to specific case studies are acceptable; broad theoretical novelty
      is not required, but rigorous methods and a clear question are.
    confidence: official
    source_url: https://conbio.org/publications/conservation-science-and-practice/
  figure_preference:
    value: >
      Contributed Papers cap display items at no more than 6 figures and/or tables in the main text, with
      additional tables/figures encouraged in Supplemental Materials where needed (per the Wiley author
      guidelines; secondary — Wiley 403s to automated fetch, verify_live).
    confidence: secondary
    source_url: https://conbio.onlinelibrary.wiley.com/hub/journal/25784854/homepage/author-guidelines
  signals:
    value: >
      Five official article groupings reveal intent: Reviews, Contributed Papers, Perspectives and Notes,
      Letters and Comments, and the unusual "Evidence" type — short communications reporting the OUTCOMES of
      conservation practice (policy development, planning, interventions), explicitly surfacing which strategies
      work and which fail. The journal's stated aim of bridging the knowledge–action gap, its welcome of
      case-specific/non-transcending studies, and its request that authors name their target audience together
      signal an applied, practitioner-serving remit.
    confidence: official
    source_url: https://conbio.org/publications/conservation-science-and-practice/

