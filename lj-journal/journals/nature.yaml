desk_reject_triggers:
  - "Importance is legible only to a narrow specialty → state the general scientific advance without inflating the claim."
  - "Main figures are a result inventory rather than a necessary evidence chain → remove or route supporting panels to Extended Data."
  - "Artwork contract is taken from memory rather than the current official guide → verify all final-production fields live."
