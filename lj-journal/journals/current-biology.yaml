scope:
  value: >
    A general journal publishing original, peer-reviewed research across ALL areas of biology, paired with
    an extensive editorial/Magazine section. Two main research formats: Articles and Reports (very concise
    findings may also run as Correspondence). A primary aim is to foster communication ACROSS fields of
    biology — both by publishing findings of general interest from diverse fields and through highly
    accessible editorial pieces that explicitly aim to inform non-specialists. All formats must be written
    accessibly for the broad Current Biology readership.
  confidence: official
  source_url: https://www.cell.com/current-biology/information-for-authors/article-types
  last_verified: 2026-06-22
# what THIS journal rewards + audience. AUTHORITATIVE sources only (official/editorial/society); null = no reliable source found, left blank by design.
taste:
  value: Current Biology rewards work from any area of biology that presents conceptual advances of
    unusual significance on a biological question of wide interest — either important to a specific
    field or intrinsically interesting to biologists broadly. Its defining aim is to foster communication
    across fields, so editors weigh whether an advance is legible and compelling to a diverse, partly
    non-specialist readership, not just subfield experts. The journal prizes concise, to-the-point reporting
    and runs a large didactic front-matter ecosystem (Dispatches, Quick Guides, Primers, Reviews, Q&As)
    that explicitly explains topics for non-specialists.
  confidence: secondary
  source_url: https://www.cell.com/current-biology/aims
  last_verified: '2026-06-22'
  audience:
    value: Biologists generally, across diverse fields, plus non-specialists. A primary aim of the journal
      is to foster communication across fields of biology, both by publishing important findings of
      general interest from diverse fields and through highly accessible editorial articles that explicitly
      aim to inform non-specialists.
    confidence: secondary
    source_url: https://www.cell.com/current-biology/aims
  writing_style:
    value: Values concise, accessible writing. Reports 'present findings of broad biological interest
      in a concise, to-the-point style'; editorial formats are highly accessible and explicitly aim
      to inform non-specialists. Correspondences must be presented concisely.
    confidence: secondary
    source_url: https://www.cell.com/current-biology/information-for-authors/article-types
  figure_preference:
    value: 'Display-item limits scale by format: Articles are typically ~10 journal pages (~5,000 words)
      with no more than seven display items (figures and tables); Reports are typically ~6 journal pages
      (~2,500 words) with no more than four display items.'
    confidence: secondary
    source_url: https://www.cell.com/current-biology/information-for-authors/article-types
  signals:
    value: 'Large editorial ''front matter'': magazine formats including Features, essays, Q&A interviews,
      the explicitly didactic Quick Guides and Primers (which explain a field or taxonomic group for
      non-specialists), Dispatches ''from the frontlines of biology'', and Reviews/Minireviews. Peer-reviewed
      research appears as Articles, Reports, and Correspondences.'
    confidence: secondary
    source_url: https://www.cell.com/current-biology/aims

