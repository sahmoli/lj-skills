desk_reject_triggers:
  - "Over format (Article >~5,000 words / >7 display items; Report >~2,500 words / >4 display items; Correspondence >1,000 words / >1 figure / >10 refs) → trim to the type's limits before submitting."
  - "No general/broad biological interest or no conceptual advance of wide significance → reframe for the cross-field readership; send a presubmission inquiry first."
  - "Summary >250 words (or, for a Report, missing the references/essential background it must carry) → fix the summary."
  - "No Resource Availability section, or data/standardized datasets/original code not deposited in a Cell Press-recommended FAIR repository with accession numbers → stage deposits now."
  - "Generative-AI created/altered research or DATA images (including brightness/contrast/color adjustments) → prohibited; submit unmanipulated images."
  - "Overused 'novel'/novelty claims → remove (editors explicitly discourage them)."

reporting:
  data_availability_statement:
    required: true
    confidence: official
    source_url: https://www.cell.com/current-biology/information-for-authors/journal-policies
    last_verified: 2026-06-22
  data_repository:
    value: "Standardized datasets MUST be deposited in a data-type-specific, Cell Press-recommended public repository BEFORE acceptance (FAIR/digital-longevity criteria per Fairsharing), with accession/permanent identifiers in the published paper; embargoes lifted by publication. Domain examples: wwPDB/EMDB (structures), Addgene (plasmids), KOMP (mouse lines)."
    confidence: official
    source_url: https://www.cell.com/current-biology/information-for-authors/journal-policies
    last_verified: 2026-06-22
  code_sharing:
    value: "Must share ALL original code reported in the paper unless legally/ethically prohibited; archive in a repository meeting digital-longevity/FAIR criteria and list it in the 'data and code availability' subsection."
    confidence: official
    source_url: https://www.cell.com/current-biology/information-for-authors/journal-policies
    last_verified: 2026-06-22
  reporting_guideline:
    value: "STAR Methods + Key Resources Table required for research articles; sex- and gender-based analysis (SGBA) reporting expected. No field-specific ecology reporting guideline (e.g., PRISMA-EcoEvo/ODMAP) mandated — it is a general biology journal."
    confidence: official
    source_url: https://www.cell.com/current-biology/information-for-authors/journal-policies
    last_verified: 2026-06-22
  sensitive_locality:
    value: "No species-locality / endangered-taxa coordinate-masking policy is stated (general biology journal — verify case-by-case with your editor). For sensitive HUMAN data that cannot be openly shared: host in well-managed controlled-access repositories and state the limitations transparently in the data availability statement."
    confidence: official
    source_url: https://www.cell.com/current-biology/information-for-authors/journal-policies
    last_verified: 2026-06-22
  orcid:
    value: "Not located on Current Biology's author pages this run. Cell Press generally collects an ORCID iD for the lead/corresponding author at submission/revision — confirm in a human browser."
    confidence: unknown
    source_url: https://www.cell.com/current-biology/information-for-authors/journal-policies
    last_verified: 2026-06-22

ai_disclosure:
  placement: inherit                    # → elsevier: named "Declaration of generative AI and AI-assisted technologies in the writing process", at the END just above References, PUBLISHED. Cell Press on-page rule confirms: a NEW section placed AFTER "Declaration of interests".
  block:
    value: >
      "During the preparation of this work, the author(s) used [NAME TOOL / SERVICE] in order to [REASON].
      After using this tool/service, the author(s) reviewed and edited the content as needed and take(s)
      full responsibility for the content of the published article." (Cell Press/Elsevier: declare at FIRST
      submission; the statement is PUBLISHED in a NEW section titled "Declaration of generative AI and
      AI-assisted technologies in the writing process," placed AFTER the "Declaration of interests" section.
      If nothing to disclose, no statement is needed. Standard grammar/spell checkers are exempt. Generative
      AI may NOT be used to create or alter research/DATA images — including brightness/contrast/color
      adjustments. AI cannot be listed as an author.)
    confidence: official
    source_url: https://www.cell.com/current-biology/information-for-authors/journal-policies
    last_verified: 2026-06-22

submission:
  portal:
    value: "Cell Press Editorial Manager — https://www.editorialmanager.com/current-biology. Presubmission inquiries strongly encouraged (email cbiol@current-biology.com). Cell Press Multi-Journal Submission (MJS) available for parallel consideration."
    confidence: official
    source_url: https://www.cell.com/current-biology/information-for-authors
    last_verified: 2026-06-22
  pack:
    value: [manuscript (Article ~5,000 words / Report ~2,500 / Correspondence 1,000), display items (<=7 Article / <=4 Report / 1 Correspondence), 250-word Summary, up to 10 keywords, cover letter conveying general significance, STAR Methods + Key Resources Table, Resource Availability section (lead contact / materials availability / data and code availability) with accession numbers, data + original code deposited in a Cell Press-recommended FAIR repository, Declaration of generative AI section (if applicable), Declaration of interests]
    confidence: secondary
    source_url: https://www.cell.com/current-biology/information-for-authors/revise-manuscript
    last_verified: 2026-06-22

