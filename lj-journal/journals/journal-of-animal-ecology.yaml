review_model:
  value: double_anonymized             # BES moved ALL journals to double-anonymous in 2023. Anonymize MS + author identity (separate title page, strip identifiable self-reference) or desk reject.
  note: "JAE transitioned to mandatory double-anonymous alongside Functional Ecology, Methods in Ecology & Evolution and J Applied Ecology, following the 3-year single-vs-double trial published by Functional Ecology in 2023. 'Confidential' double-anonymous: author and reviewer names concealed; even the cover letter must be anonymous."
  confidence: secondary                # corroborated by jecologyblog 'evolution of peer review at the BES' + appliedecologist blog; official Wiley page 403s to bots this run
  source_url: https://jecologyblog.com/2023/09/26/the-evolution-of-peer-review-at-the-bes/
  last_verified: 2026-06-22

scope:
  value: >
    Publishes the best animal-ecology research that advances ecological theory, generates novel ecological
    insight, or addresses broad ecological principles or questions — across all areas of animal ecology
    (behavioural, population, community, physiological, disease, movement, evolutionary and applied ecology),
    in any taxon, biome or system. The bar is general interest and conceptual advance, not local description.
  confidence: secondary
  source_url: https://besjournals.onlinelibrary.wiley.com/journal/13652656
  last_verified: 2026-06-22
# what THIS journal rewards + audience. AUTHORITATIVE sources only (official/editorial/society); null = no reliable source found, left blank by design.
taste:
  value: The Journal of Animal Ecology, a flagship British Ecological Society journal, rewards work
    that challenges, innovates, and advances how animal ecologists think — testing key ecological principles,
    developing new theory, or improving methods, with hypotheses that are novel or of lasting importance
    and insight that generalizes beyond the focal study system. Its audience is animal ecologists across
    subfields (behavioural, community, population, ecosystem, individual, evolutionary, physiological,
    spatial/climate, parasite/disease ecology) within the BES readership. Stylistically it expects the
    distinctive BES numbered abstract (under 350 words, simple factual numbered statements) ending in
    a "Synthesis" statement that frames broader ecological relevance for non-specialists, with figures
    that convey the key result "at a glance."
  confidence: secondary
  source_url: https://besjournals.onlinelibrary.wiley.com/hub/journal/13652656/aims-and-scope/read-full-aims-and-scope
  last_verified: '2026-06-22'
  audience:
    value: Animal ecologists across subfields (behavioural, community, population, ecosystem, individual,
      evolutionary, physiological, spatial, climate, parasite/disease ecology, macroecology) and the
      British Ecological Society readership. Bar emphasizes general interest beyond a single study system.
    confidence: secondary
    source_url: https://besjournals.onlinelibrary.wiley.com/hub/journal/13652656/aims-and-scope/read-full-aims-and-scope
  writing_style:
    value: 'Standard IMRAD: title page, abstract, Introduction, Materials and Methods, Results, Discussion,
      References. Abstract under 350 words as simple, factual, numbered statements listing main results
      and conclusions. Concise, hypothesis-driven framing emphasizing broad ecological significance.'
    confidence: secondary
    source_url: https://besjournals.onlinelibrary.wiley.com/hub/journal/13652656/journal-resources/guide-to-scientific-writing
  figure_preference:
    value: Figures should convey the important result 'at a glance' and cut down on lengthy explanations.
      Legends must be self-contained (understandable without reference to main text); all lettering
      and symbols clear and legible. Figures/tables embedded in-text or placed at end with legends.
    confidence: secondary
    source_url: https://besjournals.onlinelibrary.wiley.com/hub/journal/13652656/journal-resources/guide-to-scientific-writing
  signals:
    value: 'BES numbered-abstract convention: numbered statements giving background/justification, approach,
      key findings, and a final Synthesis statement on broader relevance. Article types reveal scope:
      Concepts (emerging ideas), Research Methods Guides (~7000w), synthetic Reviews (~8500w), In Focus
      (invited), Forum (responses/reanalysis).'
    confidence: secondary
    source_url: https://besjournals.onlinelibrary.wiley.com/hub/journal/13652656/author-guidelines

caps:                                   # MAP keyed by article_type. Caps are confidence=secondary: official Wiley page 403s to automated fetch; values are the publisher's own quoted text recovered via search.
  Research Article:                     # JAE's primary research type (the "Standard Paper")
    words:
      value: 8500
      excludes: [SI]
      includes_note: "CRITICAL & distinctive: the 8,500 cap is INCLUSIVE of nearly everything — title page, abstract, main text, references, AND figure/table legends all count. (Only Supporting Information is outside it.) This is far more inclusive than most journals, which exclude references. Over the cap → give a clear justification in the cover letter."
      confidence: secondary
      source_url: https://besjournals.onlinelibrary.wiley.com/hub/journal/13652656/author-guidelines
      last_verified: 2026-06-22
    figs_tables:
      value: "no hard numeric cap stated for Research Articles (keep display items lean; overflow to SI)"
      confidence: unknown
      source_url: https://besjournals.onlinelibrary.wiley.com/hub/journal/13652656/author-guidelines
      last_verified: 2026-06-22
    refs:
      value: "no separate numeric cap — but references COUNT toward the 8,500-word total, which is the de facto constraint"
      confidence: secondary
      source_url: https://besjournals.onlinelibrary.wiley.com/hub/journal/13652656/author-guidelines
      last_verified: 2026-06-22
    abstract:
      value: 350
      note: "Structured/numbered Summary-style abstract, normally FIVE numbered points: (1) background/justification; (2) approach & methods; (3-4) key results; (5) final synthesis statement on wider relevance. Must read in isolation. Keywords: <=8, alphabetical."
      confidence: secondary
      source_url: https://besjournals.onlinelibrary.wiley.com/hub/journal/13652656/journal-resources/guide-to-scientific-writing
      last_verified: 2026-06-22
    structure:
      value: "IMRAD body + numbered structured Summary/Abstract (5 points) ending in a synthesis statement"
      confidence: secondary
