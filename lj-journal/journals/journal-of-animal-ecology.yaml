desk_reject_triggers:
  - "Research Article over 8,500 words — and remember REFERENCES + figure/table legends + abstract + title page ALL count → trim to the cap (or justify the overage in the cover letter) before submitting; push detail to SI."
  - "Technically sound but narrowly descriptive / system-specific result with no broad ecological insight or conceptual advance → reframe the general ecological question the work answers."
  - "A 'Review' or 'Concepts' piece that merely summarises the literature (or recaps the authors' own work) → must deliver a genuine advance in ecological thinking; sharpen the novel synthesis/argument."
  - "Manuscript not anonymized for double-anonymous review (since 2023) → strip identifiable author self-reference, upload a SEPARATE title page, and keep the cover letter anonymous too."
  - "Data and/or non-standard analysis code (or theoretical model code) not archived in a public repository (Dryad) at acceptance → stage the Dryad deposit and supply a private-for-peer-review link; add a data-availability statement."
  - "Sensitive species localities exposed → mask/coarsen precise coordinates and state that you did."

reporting:
  data_availability_statement:
    required: true
    confidence: secondary
    source_url: https://besjournals.onlinelibrary.wiley.com/hub/editorial-policies
    last_verified: 2026-06-22
  data_repository:
    value: "Public archiving is a CONDITION of publication. Dryad Digital Repository is integrated with BES journals (BES covers the archiving cost). Authors list the repository + accession numbers/DOIs in a data-availability statement; if a data DOI exists, also cite the dataset in the reference list. Private-for-peer-review upload supported."
    confidence: secondary
    source_url: https://besjournals.onlinelibrary.wiley.com/hub/editorial-policies
    last_verified: 2026-06-22
  code_sharing:
    value: "New scripts for NON-STANDARD analyses must be archived alongside the data in a suitable repository (e.g. Dryad). For theoretical papers the underlying MODEL CODE must be archived."
    confidence: secondary
    source_url: https://besjournals.onlinelibrary.wiley.com/hub/editorial-policies
    last_verified: 2026-06-22
  reporting_guideline:
    value: "No single mandated checklist. BES encourages best-practice reporting; for behavioural/animal studies the STRANGE framework (sampling-bias transparency) is the field norm BES promotes, and PRISMA-EcoEvo for systematic reviews/meta-analyses. VERIFY whether STRANGE is mandated vs recommended for JAE on the live page."
    confidence: unknown
    source_url: https://besjournals.onlinelibrary.wiley.com/hub/editorial-policies
    last_verified: 2026-06-22
  sensitive_locality:
    value: "Mask/coarsen precise locations of threatened, sensitive or trafficked taxa; state that masking was done (BES editorial policy)."
    confidence: secondary
    source_url: https://besjournals.onlinelibrary.wiley.com/hub/editorial-policies
    last_verified: 2026-06-22
  orcid:
    value: "ORCID iD required for all authors at submission (BES default). CRediT contributor roles also expected."
    confidence: secondary
    source_url: https://besjournals.onlinelibrary.wiley.com/hub/journal/13652656/author-guidelines
    last_verified: 2026-06-22

ai_disclosure:
  placement: inherit                    # → wiley_bes inherits wiley: Methods OR Acknowledgements (no single mandated section)
  block:
    value: >
      "During the preparation of this work the author(s) used [TOOL/SERVICE incl. version + access date]
      in order to [REASON, e.g. improve language and readability]. After using this tool/service, the
      author(s) reviewed and edited the content as needed and take(s) full responsibility for the content
      of the publication." (Wiley/COPE: generative AI cannot be listed as an author; grammar/spell/general
      editing tools are exempt from disclosure.)
    confidence: official
    source_url: https://authorservices.wiley.com/ethics-guidelines/index.html
    last_verified: 2026-06-22

submission:
  portal:
    value: Wiley ScholarOne (Manuscript Central)
    note: "Exact path NOT confirmed this run (Wiley pages 403 to bots). BES sibling J Applied Ecology uses mc.manuscriptcentral.com/jae; the analogous JAE path is most likely mc.manuscriptcentral.com/jane — VERIFY in a human browser. Cover letter must be ANONYMOUS (double-anonymous review)."
    confidence: unknown
    source_url: https://besjournals.onlinelibrary.wiley.com/hub/journal/13652656/author-guidelines
    last_verified: 2026-06-22
  pack:
    value: [anonymized manuscript <=8500 words for a Research Article (references + legends COUNT), numbered structured Summary/Abstract <=350 words (5 points), <=8 alphabetical keywords, SEPARATE title page with author info, anonymous cover letter stating the broad ecological advance, data-availability statement, data + non-standard-analysis/model code archived (Dryad) with private-for-peer-review link, CRediT contributions, conflict-of-interest declaration, funding statement, ORCID for all authors, suggested reviewers, AI-disclosure block if applicable]
    confidence: secondary
    source_url: https://besjournals.onlinelibrary.wiley.com/hub/journal/13652656/author-guidelines
    last_verified: 2026-06-22

