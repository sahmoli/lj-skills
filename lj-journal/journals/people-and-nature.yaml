  data_repository:
    value: "Archive data in an approved public repository per the BES Data Archiving Policy (Dryad common in ecology; Zenodo/Figshare; domain-specific archives). Data sets may NOT be uploaded as Supporting Information."
    confidence: secondary
    source_url: https://besjournals.onlinelibrary.wiley.com/hub/data_archiving_policy
    last_verified: 2026-06-22
  code_sharing:
    value: "Code/scripts expected to be archived alongside data with a persistent identifier (BES reproducibility expectation)"
    confidence: secondary
    source_url: https://besjournals.onlinelibrary.wiley.com/hub/data_archiving_policy
    last_verified: 2026-06-22
  reporting_guideline:
    value: "STRANGE encouraged for behaviour/animal-sampling studies (BES-wide); discipline-appropriate reporting standards expected. No single mandated checklist across the journal."
    confidence: secondary
    source_url: https://besjournals.onlinelibrary.wiley.com/hub/data_archiving_policy
    last_verified: 2026-06-22
  sensitive_locality:
    value: "For endangered species or protected/sensitive locations, transform locality details or provide an anonymised dataset; where impossible (or politically/culturally sensitive or sensitive social data), editors may waive archiving — give a short explanation in the Data Availability Statement."
    confidence: official
    source_url: https://besjournals.onlinelibrary.wiley.com/hub/data_archiving_policy
    last_verified: 2026-06-22
  orcid:
    value: "ORCID expected (BES/Wiley default; part of the submission artefact set)"
    confidence: secondary
