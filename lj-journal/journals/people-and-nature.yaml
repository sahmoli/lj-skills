scope:
  value: >
    Broad-scope, fully open-access BES journal for high-quality work on the relationships between
    humans and nature. Deliberately interdisciplinary: rooted in ecological relevance but drawing on
    economics, sociology, geography, psychology, political science and the humanities. Welcomes
    empirical, conceptual and theoretical submissions and explicitly embraces qualitative, quantitative
    and mixed-methods research. Fosters innovation and debate across the natural- and social-science
    divide rather than single-discipline description.
  confidence: official
  source_url: https://besjournals.onlinelibrary.wiley.com/hub/journal/25758314/author_guidelines
  last_verified: 2026-06-22
# what THIS journal rewards + audience. AUTHORITATIVE sources only (official/editorial/society); null = no reliable source found, left blank by design.
taste:
  value: People and Nature rewards work that says something meaningful about BOTH the "People" and the
    "Nature" of its title — research sitting at the nexus where human–nature literatures converge, with
    broad, relational, interdisciplinary thinking prized over single-discipline depth and conceptual
    and empirical work welcomed equally. Its primary audience is academic researchers across many disciplines,
    but it explicitly engages and invites practitioners and policymakers, so papers must reach beyond
    disciplinary silos. The journal is deliberately non-prescriptive about word limits and section headings
    to respect differing disciplinary conventions, and every article carries a mandatory plain-language
    summary published alongside it to keep the work accessible to a broad readership.
  confidence: official
  source_url: https://kar.kent.ac.uk/71486/1/Gaston_et_al-2018-People_and_Nature.pdf
  last_verified: '2026-06-22'
  audience:
    value: Primary audience is academic researchers across many disciplines, but explicitly extends
      to practitioners and policymakers, whom the journal actively engages and invites to submit. Anticipates
      a very broad readership; papers must reach beyond single-discipline silos.
    confidence: official
    source_url: https://kar.kent.ac.uk/71486/1/Gaston_et_al-2018-People_and_Nature.pdf
  writing_style:
    value: Deliberately non-prescriptive on word limits and section headings, respecting differing disciplinary
      conventions. Every article carries a mandatory plain-language summary; authors may also publish
      the abstract in another language alongside English. Work should be accessible to a broad, cross-disciplinary
      audience.
    confidence: official
    source_url: https://kar.kent.ac.uk/71486/1/Gaston_et_al-2018-People_and_Nature.pdf
  figure_preference:
    value: null
    confidence: unknown
    source_url: null
  signals:
    value: Mandatory plain-language summary published alongside every article (in supporting information).
      A 'Perspective' article type aimed at non-academic audiences. Optional non-English abstract. Reviewers
      asked to specify which aspects of a manuscript they feel most comfortable assessing — a structured
      interdisciplinary-review device.
    confidence: official
    source_url: https://kar.kent.ac.uk/71486/1/Gaston_et_al-2018-People_and_Nature.pdf

