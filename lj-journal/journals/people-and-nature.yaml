desk_reject_triggers:
  - "Out of scope: single-discipline / descriptive work with no genuine people–nature or cross-disciplinary contribution → reframe around the human–nature relationship and a broad readership, or it is rejected without review."
  - "Standard literature review submitted as 'Review and Synthesis' → must instead identify evidence gaps or interpret evidence for stakeholders."
  - "No data-availability statement / data not archived in a public repository (or dumped as Supporting Information, which BES forbids) → state intended archive (Dryad/Zenodo/Figshare) at submission."
  - "Human participants/data without an ethics + informed-consent statement in Methods (Declaration of Helsinki) → add it; missing ethics can stop a social-science P&N paper."
  - "Author identity not anonymised → BES default is double-anonymous; prepare an anonymized manuscript (VERIFY live, since the journal's own older text said single-blind)."
  - "Abstract not as numbered factual statements or over 350 words; keywords outside 3–8 → fix to format."
  - "Sensitive species localities / sensitive social data exposed → transform/coarsen localities (or request an archiving waiver with explanation in the DAS)."

