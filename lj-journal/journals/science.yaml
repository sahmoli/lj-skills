artwork:
  widths: {value: "final print: 5.7 cm one column, 12.1 cm two columns, 18.4 cm three columns", confidence: official, source_url: "https://www.science.org/content/page/instructions-preparing-revised-manuscript", last_verified: 2026-08-15}
  font: {value: "sans-serif, Helvetica preferred; about 7 pt and never below 5 pt after reduction; symbols at least 6 pt", confidence: official, source_url: "https://www.science.org/content/page/instructions-preparing-initial-manuscript", last_verified: 2026-08-15}
  line_weight: {value: "minimum 0.5 pt at final reduced size; avoid light lines and screen shading", confidence: official, source_url: "https://www.science.org/content/page/instructions-preparing-initial-manuscript", last_verified: 2026-08-15}
  panel_labels: {value: "uppercase A, B, C; 10 pt bold at final size, generally upper-left; avoid subpanel labels", confidence: official, source_url: "https://www.science.org/content/page/instructions-preparing-initial-manuscript", last_verified: 2026-08-15}
  raster_dpi: {value: "minimum 300 dpi at final size for raster line art, grayscale, and colour; preferably higher; do not upsample", confidence: official, source_url: "https://www.science.org/content/page/instructions-preparing-revised-manuscript", last_verified: 2026-08-15}
  vector_formats: {value: "preferred PDF, EPS, AI for vector illustrations; PDF/EPS for vector+raster combinations", confidence: official, source_url: "https://www.science.org/content/page/instructions-preparing-revised-manuscript", last_verified: 2026-08-15}
  raster_formats: {value: "TIFF minimum 300 dpi for raster illustrations and photographs/microscopy; submit each figure separately; revised figures not embedded in Word/PowerPoint", confidence: official, source_url: "https://www.science.org/content/page/instructions-preparing-revised-manuscript", last_verified: 2026-08-15}
  colour_mode: {value: "unknown; current accessible Science-main official pages specify accessibility but not RGB/sRGB/CMYK", confidence: unknown, source_url: "https://www.science.org/content/page/instructions-preparing-revised-manuscript", last_verified: 2026-08-15}
  legend_limit: {value: "each figure caption ≤200 words; brief bold whole-figure title first; describe panels in order; full-digital summary-figure caption ≤65 words", confidence: official, source_url: "https://www.science.org/content/page/instructions-preparing-initial-manuscript", last_verified: 2026-08-15}

desk_reject_triggers:
  - "The main advance is not legible beyond the specialty → sharpen the general scientific consequence."
  - "Display-item budget is exceeded without a necessary evidence dependency → compress or move support online."
  - "Caption or artwork requirements are remembered from another Science-family journal → use the Science-main card and verify live."
