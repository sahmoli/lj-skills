scope:
  value: >
    Promotes new understanding of the interface between biological systems and ALL aspects of
    environmental change affecting a substantial part of the globe. Studies must concern biological
    systems (aquatic or terrestrial, managed or natural), at any level of organization from molecular
    to biome, covering both biological responses AND feedbacks to change. Approaches may be theoretical,
    modeling, analytical, experimental, observational, or historical — and should be exploratory rather
    than confirmatory. Publishes Research Articles, Technical Advances, Reviews, Opinions, Perspectives,
    Letters and Commentaries.
  confidence: secondary                 # quoted from journal aims&scope via journal_db; live Wiley page 403 this run
  source_url: https://onlinelibrary.wiley.com/journal/13652486
  last_verified: 2026-06-22
# what THIS journal rewards + audience. AUTHORITATIVE sources only (official/editorial/society); null = no reliable source found, left blank by design.
taste:
  value: Global Change Biology rewards work that advances understanding of how environmental change
    affecting a substantial part of the globe interacts with biological systems — spanning aquatic and
    terrestrial, managed and natural systems, from the molecular to the biome level — and explicitly
