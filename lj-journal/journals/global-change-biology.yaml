    observational, or historical in approach. Its broad article-type taxonomy (Research Articles, Technical
    Advances, Reviews/GCB Reviews/Mini Reviews, Opinions, Perspectives, plus an editor-reviewed "Science
    Behind the News" section tying current environmental crises to biological systems) signals appetite
    for both primary research and synthesis with global relevance. Communication is expected to be timely,
    objective, data-driven, and accessible to a broad readership.
