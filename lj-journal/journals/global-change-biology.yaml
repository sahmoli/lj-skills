desk_reject_triggers:
  - "Single-site / single-species / single-system result with no demonstrated generality → reframe so the signal is genuinely global ('substantial part of the globe')."
  - "Research Article main body (Intro+M&M+Results+Discussion+Acknowledgements) over 8000 words → trim; remember Acknowledgements ARE counted here (unlike NEE)."
  - "Confirmatory / incremental study → GCB explicitly wants exploratory questions; sharpen the novel hypothesis."
  - "Data-availability statement missing or 'available upon request' → deposit in a public repository and name it; 'on request' is rejected as insufficient."
  - "Misfiled article type (e.g. a 3000-word 'Letter') → GCB Letters to the Editor are 1500-word challenges with no abstract; pick the right type/limit."
  - "ORCID missing for authors → register and link before submitting."

