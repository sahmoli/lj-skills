  last_verified: 2026-06-22

scope:
  value: >
    An open-access, multidisciplinary journal publishing high-quality primary research across all
    of the natural sciences — biological, health, physical, chemical, Earth & environmental,
    mathematical, applied, engineering, and relevant social sciences — including ecology &
    evolution. Papers must represent an important advance WITHIN a specific discipline AND be of
    interest to a wide, cross-disciplinary readership. Online-only, published continuously.
  confidence: secondary
  source_url: https://www.nature.com/ncomms/aims
  last_verified: 2026-06-22
# what THIS journal rewards + audience. AUTHORITATIVE sources only (official/editorial/society); null = no reliable source found, left blank by design.
taste:
  value: 'Nature Communications rewards rigorous, comprehensive work that represents an important advance
    of significance to SPECIALISTS within a field — high quality, but explicitly not required to have
    the broad cross-disciplinary "general interest" reach demanded by Nature itself. Its primary editor
    weighs novelty, potential impact, conceptual/methodological advance, scope fit, and the work''s
    potential interest to the journal''s readership before sending it to review. The audience is specialists
    within each field plus readers in adjacent disciplines, so the writing must be cross-disciplinary
    and accessible: minimize and explain jargon, keep a non-technical abstract, and present a structured
    Article (Introduction/Results/Discussion/Methods, with topical subheadings in Results and Methods).
    Practically, a submission gets up to 10 display items with figure legends capped at 350 words.'
  confidence: secondary
  source_url: https://www.nature.com/ncomms/aims
  last_verified: '2026-06-22'
  audience:
    value: Specialists within each scientific field, plus readers in related disciplines and the wider
      scientific community; an open-access journal spanning all areas of the natural sciences. The editor
      explicitly judges 'potential interest to Nature Communications' readership' as a gatekeeping criterion.
    confidence: secondary
    source_url: https://www.nature.com/ncomms/submit/editorial-process
  writing_style:
    value: 'Demands cross-disciplinary accessibility: minimize jargon and non-standard abbreviations,
      explain unavoidable jargon, and state background, rationale and main conclusions clearly. The
      abstract must be a non-technical summary. Main text capped ~5,000 words; references ~70.'
    confidence: secondary
    source_url: https://www.nature.com/ncomms/submit/guide-to-authors
  figure_preference:
    value: Articles may include up to 10 display items (figures and/or tables), with figure legends
      limited to 350 words each.
    confidence: secondary
    source_url: https://www.nature.com/ncomms/submit/article
  signals:
    value: Structured Article format with Introduction/Results/Discussion/Methods, Results and Methods
      divided by topical subheadings, Discussion succinct without subheadings, Methods <3000 words.
      Offers 'Matters Arising' for post-publication critique. Preprint posting does NOT compromise novelty;
      conceptual overlap with prior work does.
    confidence: secondary
    source_url: https://www.nature.com/ncomms/submit/article

caps:                                         # MAP keyed by article_type. NC's primary type is "Article" (no "Letter").
  Article:                                    # primary original research
    words:
      value: "≤5,000 (main text = Introduction + Results + Discussion; Introduction itself <1,000 words)"
      excludes: [abstract, methods, references, figure_legends, tables]
      confidence: official                    # read directly from ncomms-submission-guide.pdf + ncomms-manuscript-checklist.pdf this run
      source_url: https://www.nature.com/documents/ncomms-manuscript-checklist.pdf
      last_verified: 2026-06-22
    figs_tables:
      value: "≤10 total (figures and/or tables combined)"
      confidence: official
      source_url: https://www.nature.com/documents/ncomms-manuscript-checklist.pdf
      last_verified: 2026-06-22
    refs:
      value: "up to 70 (guideline, not a hard cap)"
      confidence: official
      source_url: https://www.nature.com/documents/ncomms-submission-guide.pdf
      last_verified: 2026-06-22
    abstract:
      value: "~150 (single paragraph, unreferenced; 'Here we show' style)"
      conflict_note: "NC's own brief guide + manuscript checklist both say ≤150 words. One web-fetch summary claimed 200 — that conflates the flagship Nature template; 150 is correct for Nature Communications."
      confidence: official
      source_url: https://www.nature.com/documents/ncomms-manuscript-checklist.pdf
      last_verified: 2026-06-22
    structure:
      value: >
        Title (≤15 words) / Abstract (~150w) / Introduction (<1,000w, no subheadings, last paragraph
        summarises results+conclusions) / Results (subheadings <60 chars) / Discussion (no subheadings) /
        Methods (≤3,000w typically, subheadings) / Data Availability (after Methods, before References) /
        Code Availability (after Data Availability) / References / End Notes / Figure legends (<350w each) / Tables.
        Section headings used; footnotes not used. NC is flexible on FORMAT at initial submission.
      confidence: official
      source_url: https://www.nature.com/documents/ncomms-manuscript-checklist.pdf
      last_verified: 2026-06-22
