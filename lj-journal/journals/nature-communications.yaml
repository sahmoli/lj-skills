desk_reject_triggers:
  - "Main text over 5,000 words (Methods/refs/legends EXCLUDED) or >10 display items → trim to format; push detail to Methods/Supplementary Information."
  - "Advance is incremental or of interest only to a narrow specialty with no wider reach → reframe the cross-disciplinary significance, or send to a specialist or Communications-series (e.g. Communications Biology / Earth & Environment) venue."
  - "No Data Availability statement, or data/code not deposited & accessible to editors+reviewers at submission → add Data Availability + Code Availability sections (after Methods, before References) and stage deposits (structured depository with accession codes; Dryad/figshare/Zenodo for other source data)."
  - "Missing completed Reporting Summary for life-sciences / behavioural & social / ecological-evolutionary-environmental research → complete and upload it (it is published with the paper)."
  - "Expecting to avoid the fee → NC is fully open access with NO subscription route; the APC is mandatory unless a waiver (lowest-income countries) or a transformative/institutional agreement applies."
  - "Choosing double-anonymized review but leaving identifying information in the manuscript → anonymize the manuscript; put author identities in the cover letter only."

reporting:
  data_availability_statement:
    required: true
    confidence: official                      # PDF: "For all papers section 'Data availability' is provided after the Methods section but before the References"
    source_url: https://www.nature.com/documents/ncomms-submission-guide.pdf
    last_verified: 2026-06-22
  data_repository:
    value: "Certain data types MUST be deposited in an appropriate public structured depository with accession number(s) in the manuscript; full access required at publication (and to reviewers if requested). Other source data encouraged in unstructured depositories (Dryad / figshare) or as Supplementary Information; dataset descriptions can be published in Scientific Data."
    confidence: official
    source_url: https://www.nature.com/documents/ncomms-submission-guide.pdf
    last_verified: 2026-06-22
  code_sharing:
    value: "Previously-unreported custom code central to the main claims must be available to editors & reviewers on request; a 'Code availability' statement (after Data Availability, before References) is required when such code is central; authors complete a code & software submission checklist; best practice is to release code so readers can repeat results (e.g. Zenodo/GitHub release with DOI)."
    confidence: official
    source_url: https://www.nature.com/documents/ncomms-submission-guide.pdf
    last_verified: 2026-06-22
  reporting_guideline:
    value: "A completed Reporting Summary is required for life-sciences, behavioural & social sciences, AND ecological, evolutionary & environmental sciences research (published with the paper). Domain checklists where applicable: CONSORT (clinical trials), REMARK (tumour-marker prognostic studies), BRISQ (biospecimens). No mandated ecology checklist (e.g. PRISMA-EcoEvo/ODMAP) found."
    confidence: official
    source_url: https://www.nature.com/documents/ncomms-submission-guide.pdf
    last_verified: 2026-06-22
  sensitive_locality:
    value: "No prominent threatened-taxa locality-masking rule found on NC pages this run (unlike conservation journals); Nature Portfolio has general data-availability, biosecurity/dual-use and human-data policies — VERIFY whether precise localities of at-risk species must be coarsened for an ecology submission."
    confidence: unknown
    source_url: https://www.nature.com/nature-portfolio/editorial-policies
    last_verified: 2026-06-22
  orcid:
    value: "ORCID required for the corresponding author (Nature Portfolio policy)"
    confidence: secondary
    source_url: https://www.nature.com/nature-portfolio/editorial-policies
    last_verified: 2026-06-22

ai_disclosure:
  placement: inherit                          # → nature_portfolio: Methods section (or suitable alternative part if no Methods); pure copy-editing exempt
  block:
    value: >
      "Use of [TOOL/SERVICE, e.g. ChatGPT] was documented as follows: [what it was used for and how
      output was checked]." Place in the Methods section (or a suitable alternative part if no Methods).
      Large Language Models do NOT meet Nature's authorship criteria and cannot be listed as authors.
      Pure AI copy-editing (grammar/tone) needs no declaration. Generative-AI images are generally
      prohibited; non-generative image-ML use is disclosed in the figure caption.
    confidence: official
    source_url: https://www.nature.com/nature-portfolio/editorial-policies/ai
    last_verified: 2026-06-22

submission:
  portal:
    value: "Nature manuscript-tracking system (Editorial Manager / snapp family) — https://mts-ncomms.nature.com/"
    confidence: secondary
    source_url: https://www.nature.com/ncomms/submit/how-to-submit
    last_verified: 2026-06-22
  pack:
    value: [manuscript file (incl. Methods; flexible format at initial submission), cover letter (optional but encouraged for context/competing-interests/related-work), abstract (~150w, unreferenced), figures/display items (≤10; high-res not required at initial submission), Data Availability statement, Code Availability statement (if applicable), completed Reporting Summary (if applicable), competing-interests statement, author-contributions statement, ORCID (corresponding author), AI-disclosure in Methods if generative AI used, Supplementary Information, optional double-anonymized-review request]
    confidence: official
    source_url: https://www.nature.com/documents/ncomms-submission-guide.pdf
    last_verified: 2026-06-22

