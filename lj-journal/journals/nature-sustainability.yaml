desk_reject_triggers:
  - "Over the per-type word cap or display-item cap (Article 3,500w/6 items; Brief Comm 1,500w/2 items) → trim to format BEFORE submitting."
  - "Local/descriptive study without broad transdisciplinary significance or a solution angle → reframe for a general sustainability readership."
  - "Manuscript not accessible to non-specialists / too technical / no narrative arc → rewrite for a broad smart audience (Nature house priority)."
  - "No Data Availability Statement, or data/code not deposited in a public repository → prepare deposit + the Nature Reporting Summary before peer review."
  - "Submitting a non-primary type (Comment/Review/Perspective/Correspondence) that contains original unpublished research data → these can't carry primary research; submit as Article/Analysis (and they're not Gold-OA eligible)."
  - "Opted into double-anonymized review but left author identity in the manuscript → editor will NOT check; you break your own anonymity."

reporting:
  data_availability_statement:
    required: true
    confidence: official
    source_url: https://www.nature.com/natsustain/editorial-policies
    last_verified: 2026-06-22
  data_repository:
    value: "Deposit underlying data in an appropriate community/public repository (e.g., Figshare, Zenodo, Dryad); DOI'd datasets may be cited in the reference list. Source data encouraged for figures."
    confidence: official
    source_url: https://www.nature.com/natsustain/editorial-policies
    last_verified: 2026-06-22
  code_sharing:
    value: "Required when newly developed code is central to the paper — complete the Software submission checklist; code must be available for peer review and on publication."
    confidence: official
    source_url: https://www.nature.com/natsustain/editorial-policies
    last_verified: 2026-06-22
  reporting_guideline:
    value: "Nature 'Reporting Summary' required at peer review for life/clinical/behavioural & social/ecology, evolution & environmental sciences manuscripts (transparent-reporting form)."
    confidence: official
    source_url: https://www.nature.com/natsustain/editorial-policies
    last_verified: 2026-06-22
  sensitive_locality:
    value: "Nature Portfolio permits withholding genuinely sensitive data (e.g., precise locations of endangered/at-risk species) under its data-availability/research-ethics policy — state the restriction."
    confidence: secondary
    source_url: https://www.nature.com/natsustain/editorial-policies
    last_verified: 2026-06-22
  orcid:
    value: "ORCID required for the corresponding author (Nature Portfolio mandatory)."
    confidence: official
    source_url: https://www.nature.com/natsustain/submission-guidelines/orcid
    last_verified: 2026-06-22

ai_disclosure:
  placement: inherit                          # → nature_portfolio: document generative-AI/LLM use in the Methods section (or suitable alternative if no Methods)
  block:
    value: >
      Declare any use of generative AI / LLM-assisted technology in the Methods section (or a suitable
      alternative part if there is no Methods). Pure AI copy-editing of grammar/tone needs NO declaration.
      AI tools cannot be listed as authors. Generative-AI-created images/figures are generally prohibited;
      disclose non-generative ML image processing in the figure caption.
    confidence: official
    source_url: https://www.nature.com/nature-portfolio/editorial-policies/ai
    last_verified: 2026-06-22

submission:
