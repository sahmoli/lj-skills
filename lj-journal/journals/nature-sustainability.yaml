  pack:
    value: [cover letter, manuscript within per-type word cap, abstract (150w for Article), <=6 display items (Article), Data Availability Statement, code availability + Software checklist if code is central, Nature Reporting Summary (at peer review), AI-disclosure in Methods if used, ORCID for corresponding author, suggested reviewers, optional presubmission enquiry, tick double-anon box + anonymize if opting in]
    confidence: official
    source_url: https://www.nature.com/natsustain/content
    last_verified: 2026-06-22

