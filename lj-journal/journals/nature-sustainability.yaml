scope:
  value: >
    Publishes significant original research from a broad range of natural, social and engineering
    fields about sustainability, its policy dimensions and possible solutions. Overarching goal:
    understand how to ensure the well-being of current and future generations within the limits of
    the natural world. Fosters integrated knowledge across Earth, social and technological systems
    and their interfaces (explicitly aligned with the UN Sustainable Development Goals agenda).
  confidence: official
  source_url: https://www.nature.com/natsustain/aims
  last_verified: 2026-06-22
# what THIS journal rewards + audience. AUTHORITATIVE sources only (official/editorial/society); null = no reliable source found, left blank by design.
taste:
  value: Nature Sustainability rewards significant original research that advances the well-being of
    current and future generations within natural limits, transcending disciplinary boundaries across
    the natural, social and engineering sciences and explicitly engaging sustainability's policy dimensions
    and possible solutions. It prizes insight that catalyses wise action rather than knowledge alone,
    and its dedicated Analysis and policy-facing Comment formats signal a strong appetite for solutions-
    and policy-oriented synthesis. The audience is a cross-disciplinary community of sustainability
    scholars plus policymakers, with an explicit editorial mission to narrow the gap between research
    and policy making.
  confidence: official
  source_url: https://www.nature.com/natsustain/aims
  last_verified: '2026-06-22'
  audience:
    value: Cross-disciplinary sustainability research community plus policymakers — researchers seeking
      integrated knowledge across natural, social and engineering/technological systems, and those bridging
      research and policy making. Inaugural editorial frames a community of sustainability scholars
      and those arriving from traditional disciplines.
    confidence: official
    source_url: https://www.nature.com/natsustain/aims
  writing_style:
    value: No prose style/tone rules on the aims page, but submission guidelines impose tight limits
      (e.g. Brief Communication abstract ~3 sentences/<=70 words, title <=10 words, main text <=1,500
      words with no headings, Methods <=500 words). Comment articles are opinionated, agenda-setting
      and provocative pieces calling for action on timely sustainability/policy issues.
    confidence: secondary
    source_url: https://www.nature.com/natsustain/content
  figure_preference:
    value: No qualitative figure-style guidance found on authoritative pages; only quantitative display-item
      caps in submission guidelines (e.g. Brief Communication up to 2 display items, flexible at editor
      discretion within the page limit).
    confidence: secondary
    source_url: https://www.nature.com/natsustain/submission-guidelines
  signals:
    value: 'Defined content types signal what it wants: Articles, Analysis (new analysis of existing
      data / new simulation or model leading to novel and arresting conclusions of broad importance,
      incl. systematic reviews/meta-analyses), Perspectives, Reviews, Comment, News & Views, Features,
      Correspondence. The ''Analysis'' and policy-relevant ''Comment'' formats reveal appetite for solutions-
      and policy-facing synthesis.'
    confidence: official
    source_url: https://www.nature.com/natsustain/content

