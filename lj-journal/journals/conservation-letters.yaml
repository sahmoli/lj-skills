desk_reject_triggers:
  - "Over the 3000-word Letter cap or >8 display items → trim to the format BEFORE submitting."
  - "Local/descriptive result with no transferable policy or management implication → reframe the 'so what for conservation'."
  - "No data-availability statement / data not in a public repository → stage the deposit (Dryad/Zenodo) now."
  - "Author identity not anonymized when submitting → a secondary guide flags this as a delay/return cause; prepare an anonymized version (review model unconfirmed — assume anonymization may be required)."
  - "Sensitive species localities exposed → mask/coarsen and state that you did."

