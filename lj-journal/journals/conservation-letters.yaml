scope:
  value: >
    Publishes empirical and theoretical research with immediate, direct implications for the
    conservation of biological diversity worldwide. Prizes concise, original, timely papers that
    influence policy debate and management solutions across marine, terrestrial and freshwater
    contexts, bridging biological and social sciences — not local description.
  confidence: official
  source_url: https://conbio.org/publications/conservation-letters/
  last_verified: 2026-06-22
# what THIS journal rewards + audience. AUTHORITATIVE sources only (official/editorial/society); null = no reliable source found, left blank by design.
taste:
  value: 'Conservation Letters rewards concise papers renowned for their originality, timeliness, and
    influence on policy debates and management solutions; the bar is novelty plus demonstrable impact
    on conservation policy and practice. Papers are short (no more than 2500-3000 words and no more
    than 8 tables/figures), and authors are expected to clearly articulate the significance of their
    findings for conservation policy and practice. Five article types structure the journal: Letters,
    Reviews, Policy Perspectives, Correspondence, and Viewpoint.'
  confidence: official
  source_url: https://conbio.org/publications/conservation-letters/
  last_verified: '2026-06-22'
  audience:
    value: null
    confidence: unknown
    source_url: null
  writing_style:
    value: 'Brevity and immediacy are core: submissions are no more than 2500-3000 words. Letters present
      novel findings of high relevance, and authors are expected to articulate how findings apply to
      conservation policy and practice.'
    confidence: official
    source_url: https://conbio.org/publications/conservation-letters/
  figure_preference:
    value: 'Caps display items: no more than 8 tables and/or figures per submission, reinforcing the
      concise, high-signal format.'
    confidence: official
    source_url: https://conbio.org/publications/conservation-letters/
  signals:
    value: 'Five named article types reveal intent: Letters (novel findings for practice/policy), Reviews,
      Policy Perspectives, Correspondence, and editor-facing Viewpoint. Authors must clearly articulate
      the significance of findings for conservation policy and practice.'
    confidence: official
    source_url: https://conbio.org/publications/conservation-letters/

