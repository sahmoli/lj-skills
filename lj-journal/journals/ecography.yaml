desk_reject_triggers:
  - "Author identity left in the main text file → double-blind: keep names/affiliations ONLY in a separate title-page file."
  - "Over the per-type word cap (Research 5000 main text; Forum 3500; Review 7500; Brevia/News&Views 1500 all-in) or over the display-item cap (Research 6, Forum 4, Review 10) → trim to format before submitting."
  - "No code/data uploaded at FIRST submission → Ecography requires data + custom code at submission so reviewers can verify replication (it need not be public yet)."
  - "Missing Significance statement (why it matters + why Ecography) → write it; the journal uses it for triage."
  - "Purely descriptive single-locality result with no spatial/temporal-pattern inference or method/theory advance → reframe the general contribution."
  - "Sensitive species localities exposed → anonymise data; use Dryad private-for-review and state masking."

reporting:
  data_availability_statement:
    required: true
    confidence: official
    source_url: https://www.ecography.org/authors/author-guidelines
    last_verified: 2026-06-22
  data_repository:
    value: "Public repository with persistent DOI required upon acceptance; data + custom code REQUIRED already at first submission for review. Dryad Digital Repository free for Ecography authors; Zenodo/Figshare/GitHub-archived-to-Zenodo also fine."
    confidence: official
    source_url: https://www.ecography.org/authors/author-guidelines
    last_verified: 2026-06-22
  code_sharing:
    value: "Mandatory: custom code (simulations, non-standard stats) and bespoke software required at first submission and publicly archived with a DOI on acceptance."
    confidence: official
    source_url: https://www.ecography.org/authors/author-guidelines
    last_verified: 2026-06-22
  reporting_guideline:
    value: "ODMAP protocol (Zurell et al. 2020, published in Ecography) is the de-facto standard for SDM/biodiversity-model papers — provide the full checklist (preferably in the appendix). Not explicitly mandated in the current guidelines text read this run."
    confidence: secondary
    source_url: https://nsojournals.onlinelibrary.wiley.com/doi/10.1111/ecog.04960
    last_verified: 2026-06-22
  sensitive_locality:
    value: "Anonymise sensitive data (e.g. threatened-species locations) before archiving; Dryad private-for-review option encouraged to conceal identity during review."
    confidence: official
    source_url: https://www.ecography.org/authors/author-guidelines
    last_verified: 2026-06-22
  orcid:
    value: "ORCID iD MANDATORY for corresponding author at submission (entered in ScholarOne profile); co-authors strongly encouraged."
    confidence: official
    source_url: https://www.ecography.org/authors/author-guidelines
    last_verified: 2026-06-22

