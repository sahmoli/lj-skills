scope:
  value: >
    Research on ecological and geographical patterns of biodiversity in space and time — population,
    community, and ecosystem ecology, macroecology, biogeography, and the methods that underpin them
    (incl. species distribution modelling). Emphasis on novel, significant contributions that test
    theory/methodology or deliver new analytical tools; purely descriptive local studies are discouraged.
  confidence: official
  source_url: https://www.ecography.org/authors/author-guidelines
  last_verified: 2026-06-22
# what THIS journal rewards + audience. AUTHORITATIVE sources only (official/editorial/society); null = no reliable source found, left blank by design.
taste:
  value: Ecography rewards work that significantly advances understanding of ecological or biodiversity
    patterns in space or time, prizing originality, broad general interest, and the development or testing
    of theory, methodology, or new analytical tools. Manuscripts are expected to address general principles
    in ecology (a specific model system is fine only if framed against a generalized question); purely
    descriptive papers are considered only if breaking new ground, and single-species or single-location
    studies are discouraged unless they meaningfully advance general theory. Its audience spans spatial
    ecology, macroecology, biogeography, and community/population ecology, with explicitly no biases
    regarding taxon, biome, or biogeographical area. Distinctive article types (Forum for new conceptual
    ideas, Brevia, Software Notes for spatial-temporal analysis tools, Review and Synthesis, and News
    and Views) signal a strong methods-and-theory orientation.
  confidence: official
  source_url: https://www.ecography.org/authors/aims-scope
  last_verified: '2026-06-22'
  audience:
    value: Researchers in spatial ecology, macroecology, biogeography, community/population ecology,
      and ecological conservation. Judged by originality and appeal to general interest, with no biases
      regarding taxon, biome, or biogeographical area; conservation work must advance general theory
      beyond a single case.
    confidence: official
    source_url: https://www.ecography.org/authors/aims-scope
  writing_style:
    value: Manuscripts must address general principles in ecology; a specific model system is acceptable
      only if framed relative to a generalized ecological question. Purely descriptive papers are considered
      only if breaking new ground and/or describing patterns seldom explored.
    confidence: official
    source_url: https://nso-journals.org/ecography-for-authors
  figure_preference:
    value: 'Display items are capped per article type, counting figures, tables AND boxes together:
      Original Research max 6 (within 5000 words), Forum max 4, Review and Synthesis max 10, Software
      Notes 2, and Brevia/News and Views 1-2 items. Boxes are an accepted display format.'
    confidence: official
    source_url: https://nso-journals.org/ecography-for-authors
  signals:
    value: 'Named article types reveal priorities: Forum (short empirical/conceptual/theoretical papers
      about new and exciting ideas), Brevia (concise presentation of important new results), Software
      Notes (new non-commercial software for spatial-temporal analysis), Review and Synthesis, and News
      and Views commenting on recent original research.'
    confidence: official
    source_url: https://nso-journals.org/ecography-for-authors

