desk_reject_triggers:
  - "Over the 6000-word research cap (introduction → acknowledgements) → trim before submitting; shorter papers are explicitly encouraged."
  - "Purely descriptive biodiversity-pattern paper with no conservation implication → add an explicit conservation/applied dimension (THE classic D&D desk reject)."
  - "Manuscript not anonymized (journal is double-anonymous) → strip author identity from body, use a separate title page, and anonymize deposited data, else desk reject."
  - "No data-availability statement / data not in a public repository before submission → deposit in Dryad (or domain archive) and cite the DOI/link."
  - "Sensitive/threatened-taxa localities exposed → mask/coarsen coordinates and state that you did."

