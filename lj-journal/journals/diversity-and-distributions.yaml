scope:
  value: >
    Conservation biogeography: the application of biogeographical principles, theories and analyses to
    problems concerning biodiversity conservation. Spans all taxa (bacteria to plants and animals) and all
    ecosystems — biological invasions, climate-change impacts on distributions, species-richness patterns,
    niche/species-distribution modelling, and biodiversity status & trends. Papers must derive novel insight
    from biogeographic pattern/process; it no longer accepts purely descriptive biodiversity-pattern papers
    that lack a conservation focus.
  confidence: secondary               # remit well-established; not read off official page this run (403)
  source_url: https://onlinelibrary.wiley.com/journal/14724642
  last_verified: 2026-06-22
# what THIS journal rewards + audience. AUTHORITATIVE sources only (official/editorial/society); null = no reliable source found, left blank by design.
taste:
  value: 'Diversity and Distributions rewards conservation biogeography in which conservation implications
    are CENTRAL rather than incidental: applying biogeographical principles, theory and analysis to
    biodiversity-conservation problems. Merely mentioning conservation, or working on a threatened species
    without elaborated conservation implications, is explicitly "not a good fit." Its audience is international
    conservation biogeographers and biodiversity scientists (biogeography, ecology, conservation biology,
    species-distribution modelling, invasion science) plus conservation planners and risk-assessors
    who apply range-scale patterns to landscape-level decisions. Manuscripts must be concise and clearly
    written in English with a full standard structure, and a Data Availability Statement with access
    to underlying data is mandatory — submissions lacking one are returned to the author absent a Senior-Editor
    exception.'
  confidence: secondary
  source_url: https://onlinelibrary.wiley.com/page/journal/14724642/homepage/productinformation.html
  last_verified: '2026-06-22'
  audience:
    value: 'International conservation biogeographers and biodiversity scientists: researchers in biogeography,
